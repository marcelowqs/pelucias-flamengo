/* ============ despesas fixas e impostos ============ */
const CATS_PAGAR=['Salários','Encargos (INSS, FGTS)','Pró-labore','Benefícios','Aluguel','Condomínio e IPTU','Bloco 39 – armazém','Contador','Advocacia','Sistemas e software','Energia, telefone e internet','Impostos','Royalties','Comissões','Compra de mercadoria','Frete de compra','Frete de venda','Armazenagem','Marketing','Tarifas bancárias','Despesas operacionais','Outros'];
const fixaAtiva=(f,k)=>f.ativo!==false&&(!f.inicio||f.inicio<=k)&&(!f.fim||f.fim>=k);
function fixasPeriodo(ini,fim){const out={};let k=mkey(ini);const kf=mkey(fim);let g=0;
  while(k<=kf&&g++<240){(S.fixas||[]).forEach(f=>{if(fixaAtiva(f,k))out[f.cat||'Outros']=(out[f.cat||'Outros']||0)+n(f.valor)});k=nextMonthKey(k,1)}
  return Object.entries(out).map(([cat,v])=>({cat,v})).sort((a,b)=>b.v-a.v)}
function impostosMes(k){const c=S.cfg;const ps=pedFat().filter(p=>mkey(p.faturadoEm)===k);const b=sum(ps,p=>dreCalc(p).bruto),cm=sum(ps,p=>dreCalc(p).cmv);
  const icms=b*n(c.icms)/100-cm*n(c.icmsCredito)/100;
  return [['ICMS',Math.max(0,icms)],['PIS',b*n(c.pis)/100],['COFINS',b*n(c.cofins)/100],['IRPJ + CSLL',b*n(c.irpj)/100],['Outros impostos',b*n(c.outrosImp)/100]].filter(x=>x[1]>0.005).map(([nm,v])=>({nm,v:r2(v)}))}
function blocoFixas(){const k=mkey(today());const fx=S.fixas||[];const at=fx.filter(f=>fixaAtiva(f,k));
  return `<div class="card"><h2>Despesas fixas mensais <span class="acts"><button class="btn sm" data-act="lancFixas">Lançar despesas do mês</button><button class="btn sm" data-act="lancImp">Lançar impostos do mês</button><button class="btn sm pri" data-act="editFixa">+ Despesa fixa</button></span></h2>
  ${fx.length?`<div class="tw"><table><thead><tr><th>Despesa</th><th>Categoria</th><th>Favorecido</th><th class="n">Dia</th><th class="n">Valor mensal</th><th>Situação</th></tr></thead><tbody>
  ${fx.slice().sort((a,b)=>(a.cat||'').localeCompare(b.cat||'')||n(b.valor)-n(a.valor)).map(f=>`<tr class="click" data-act="editFixa" data-id="${f.id}"><td><b>${h(f.desc)}</b></td><td>${h(f.cat||'')}</td><td>${h(f.fav||'')}</td><td class="n">${n(f.dia)||'—'}</td><td class="n">${R(f.valor)}</td><td>${fixaAtiva(f,k)?chip('Ativa','c-ok'):chip(f.ativo===false?'Pausada':'Fora da vigência')}</td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="4">Total mensal das ativas (${at.length})</td><td class="n">${R(sum(at,f=>n(f.valor)))}</td><td></td></tr></tfoot></table></div>`:'<p class="note">Cadastre salários, encargos, aluguel, contador, sistemas e o que mais se repete todo mês. Depois é um clique para lançar o mês inteiro em Contas a pagar, e o DRE passa a mostrar cada categoria.</p>'}</div>`}
ACT.editFixa=d=>{const f=d.id?S.fixas.find(x=>x.id===d.id):{desc:'',cat:'Salários',fav:'',valor:'',dia:5,inicio:mkey(today()),fim:'',ativo:true,obs:''};
  openModal(d.id?'Despesa fixa':'Nova despesa fixa',{body:()=>`<div class="fg">${fld('fx_d','Descrição',f.desc,{w:'w2',ph:'Ex.: Salário auxiliar de estoque'})}${fld('fx_c','Categoria',0,{sel:CATS_PAGAR.map(c=>opt(c,c,f.cat)).join('')})}${fld('fx_f','Favorecido',f.fav)}${fld('fx_v','Valor mensal (R$)',f.valor,{t:'number'})}${fld('fx_dia','Dia de vencimento',f.dia,{t:'number'})}
   ${fld('fx_i','A partir de',f.inicio,{t:'month'})}${fld('fx_fim','Até (opcional)',f.fim,{t:'month'})}${fld('fx_a','Situação',0,{sel:opt('1','Ativa',f.ativo!==false?'1':'0')+opt('0','Pausada',f.ativo!==false?'1':'0')})}${fld('fx_o','Observações',f.obs,{ta:1,w:'wf'})}</div>`,
   foot:()=>`${d.id?`<button class="btn dng" data-act="delFixa" data-id="${d.id}">Excluir</button>`:''}<span class="sp"></span><button class="btn" data-act="closeM">Cancelar</button><button class="btn pri" data-act="salvaFixa" data-id="${d.id||''}">Salvar</button>`})};
ACT.salvaFixa=d=>{const o={desc:fv('fx_d').trim(),cat:fv('fx_c'),fav:fv('fx_f').trim(),valor:n(fv('fx_v')),dia:Math.min(31,Math.max(1,n(fv('fx_dia'))||5)),inicio:fv('fx_i'),fim:fv('fx_fim'),ativo:fv('fx_a')==='1',obs:fv('fx_o')};
  if(!o.desc||!o.valor)return toast('Preencha a descrição e o valor.','err');S.fixas=S.fixas||[];
  if(d.id)Object.assign(S.fixas.find(x=>x.id===d.id),o);else S.fixas.push({id:uid(),...o});save();closeModal();render();toast('Despesa fixa salva','okk')};
ACT.delFixa=(d,b)=>{if(!armed(b))return;S.fixas=S.fixas.filter(x=>x.id!==d.id);save();closeModal();render()};
const vencDia=(k,dia)=>{const ld=+lastDay(k).slice(8);return k+'-'+pad(Math.min(ld,Math.max(1,n(dia)||10)))};
ACT.lancFixas=()=>{const k0=mkey(today());const meses=[nextMonthKey(k0,-1),k0,nextMonthKey(k0,1)];UI.lfK=UI.lfK||k0;
  const corpo=()=>{const k=UI.lfK;const fs=(S.fixas||[]).filter(f=>fixaAtiva(f,k));const ja=f=>S.pagar.some(t=>t.origem==='fixa'&&t.ref===f.id&&t.key===k);
    return `${fld('lf_k','Mês',0,{sel:meses.map(m=>opt(m,ML(m),k)).join('')})}${fs.length?`<div class="tw"><table><thead><tr><th>Despesa</th><th>Vencimento</th><th class="n">Valor</th><th></th></tr></thead><tbody>${fs.map(f=>`<tr><td>${h(f.desc)}<div class="sm mut">${h(f.cat)}</div></td><td>${D(vencDia(k,f.dia))}</td><td class="n">${R(f.valor)}</td><td>${ja(f)?chip('já lançada','c-ok'):chip('nova','c-gold')}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">A lançar</td><td class="n">${R(sum(fs.filter(f=>!ja(f)),f=>n(f.valor)))}</td><td></td></tr></tfoot></table></div>`:'<p class="note">Nenhuma despesa fixa ativa neste mês.</p>'}`};
  openModal('Lançar despesas fixas',{body:corpo,onChange:e=>{if(e.target.id==='lf_k'){UI.lfK=e.target.value;drawModal()}},foot:()=>`<span class="sp"></span><button class="btn" data-act="closeM">Cancelar</button><button class="btn pri" data-act="lfOk">Lançar em Contas a pagar</button>`})};
ACT.lfOk=()=>{const k=UI.lfK;let q=0;(S.fixas||[]).filter(f=>fixaAtiva(f,k)).forEach(f=>{if(S.pagar.some(t=>t.origem==='fixa'&&t.ref===f.id&&t.key===k))return;
    S.pagar.push({id:uid(),origem:'fixa',ref:f.id,key:k,desc:`${f.desc} – ${ML(k)}`,fav:f.fav||'',cat:f.cat,venc:vencDia(k,f.dia),valor:n(f.valor),pago:false,pagoEm:''});q++});
  save();closeModal();render();toast(q?`${q} despesa(s) de ${ML(k)} lançada(s)`:'Nada novo para lançar neste mês.',q?'okk':'')};
ACT.lancImp=()=>{const k0=nextMonthKey(mkey(today()),-1);UI.liK=UI.liK||k0;const meses=[nextMonthKey(mkey(today()),-2),k0,mkey(today())];
  const corpo=()=>{const k=UI.liK;const im=impostosMes(k);const ja=x=>S.pagar.some(t=>t.origem==='imposto'&&t.ref===x.nm&&t.key===k);const venc=vencDia(nextMonthKey(k,1),S.cfg.diaVencImpostos);
    return `${fld('li_k','Vendas de',0,{sel:meses.map(m=>opt(m,ML(m),k)).join('')})}<p class="note">Calculado sobre as vendas faturadas no mês com as alíquotas de Ajustes. Vencimento em ${D(venc)}. Confira com o contador antes de pagar.</p>
    ${im.length?`<div class="tw"><table><thead><tr><th>Imposto</th><th class="n">Valor</th><th></th></tr></thead><tbody>${im.map(x=>`<tr><td>${x.nm}</td><td class="n">${R(x.v)}</td><td>${ja(x)?chip('já lançado','c-ok'):chip('novo','c-gold')}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td class="n">${R(sum(im,x=>x.v))}</td><td></td></tr></tfoot></table></div>`:'<p class="note">Sem vendas faturadas neste mês.</p>'}`};
  openModal('Lançar impostos do mês',{body:corpo,onChange:e=>{if(e.target.id==='li_k'){UI.liK=e.target.value;drawModal()}},foot:()=>`<span class="sp"></span><button class="btn" data-act="closeM">Cancelar</button><button class="btn pri" data-act="liOk">Lançar em Contas a pagar</button>`})};
ACT.liOk=()=>{const k=UI.liK;const venc=vencDia(nextMonthKey(k,1),S.cfg.diaVencImpostos);let q=0;
  impostosMes(k).forEach(x=>{if(S.pagar.some(t=>t.origem==='imposto'&&t.ref===x.nm&&t.key===k))return;S.pagar.push({id:uid(),origem:'imposto',ref:x.nm,key:k,desc:`${x.nm} – vendas de ${ML(k)}`,fav:'Receita / SEFAZ',cat:'Impostos',venc,valor:x.v,pago:false,pagoEm:''});q++});
  save();closeModal();render();toast(q?`${q} imposto(s) lançado(s)`:'Nada novo para lançar.',q?'okk':'')};

/* ============ marketing ============ */
const MKT_TIPOS=['Ativação em loja','Material de PDV / vitrine','Redes sociais','Influenciador','Evento / jogo no Maracanã','Promoção / condição comercial','Catálogo / site B2B','Mídia paga','Treinamento de vendedores','Outro'];
const MKT_ST={planejada:['Planejada',''],andamento:['Em andamento','c-gold'],concluida:['Concluída','c-ok'],cancelada:['Cancelada','c-bad']};
function mktLojas(a){const ls=allLojas();if(a.alvo==='gestores')return ls.filter(o=>(a.gestores||[]).includes(o.g.id)).map(o=>o.l.id);
  if(a.alvo==='uf'){const u=String(a.ufs||'').toUpperCase().split(/[\s,;]+/).filter(Boolean);return ls.filter(o=>u.includes((o.l.uf||'').toUpperCase())).map(o=>o.l.id)}return null}
function mktVendas(a,ini,fim){const lj=mktLojas(a);const pids=(a.pids||[]).length?a.pids:null;let b=0,pc=0,mc=0,ped=0;
  pedFat().filter(p=>p.faturadoEm>=ini&&p.faturadoEm<=fim&&(!lj||lj.includes(p.lojaId))).forEach(p=>{const d=dreCalc(p);let tem=false;d.itens.forEach(i=>{if(pids&&!pids.includes(i.pid))return;b+=i.bruto;pc+=i.qtd;mc+=i.mc;tem=true});if(tem)ped++});return {b,pc,mc,ped}}
function mktResultado(a){if(!a.ini)return null;const fim=a.fim||a.ini;const dur=diffDays(a.ini,fim)+1;const at=mktVendas(a,a.ini,fim<today()?fim:today());
  const ant=mktVendas(a,addDays(a.ini,-dur),addDays(a.ini,-1));const gasto=sum(a.despesas||[],x=>n(x.valor));const incMC=at.mc-ant.mc;
  return {at,ant,gasto,incB:at.b-ant.b,incMC,roi:gasto?(incMC-gasto)/gasto*100:null,meta:n(a.meta)}}
VIEWS.marketing=()=>{const t=today(),y=t.slice(0,4);const as=(S.mkt||[]).slice().sort((a,b)=>(b.ini||'').localeCompare(a.ini||''));
  const doAno=as.filter(a=>(a.ini||'').startsWith(y));const orc=sum(doAno,a=>n(a.orc)),gasto=sum(doAno,a=>sum(a.despesas||[],x=>n(x.valor)));
  const and=as.filter(a=>a.status==='andamento'||(a.status!=='cancelada'&&a.ini<=t&&(a.fim||a.ini)>=t));
  const prox=as.filter(a=>a.status!=='cancelada'&&a.ini>t).sort((a,b)=>a.ini.localeCompare(b.ini));
  const linha=a=>{const r=mktResultado(a);const st=MKT_ST[a.status]||[a.status,''];return `<tr class="click" data-act="editMkt" data-id="${a.id}"><td><b>${h(a.nome)}</b><div class="sm mut">${h(a.tipo||'')} · ${a.alvo==='gestores'?(a.gestores||[]).length+' gestor(es)':a.alvo==='uf'?'UF '+h(a.ufs||''):'todas as lojas'}${(a.pids||[]).length?' · '+a.pids.length+' modelo(s)':''}</div></td><td>${D(a.ini)} a ${D(a.fim||a.ini)}</td><td>${chip(...st)}</td><td class="n">${R(a.orc)}</td><td class="n ${r&&r.gasto>n(a.orc)&&n(a.orc)?'bad':''}">${R(r?r.gasto:0)}</td><td class="n">${r?R(r.at.b):'—'}</td><td class="n">${r&&(r.at.b||r.ant.b)?`<span class="${r.incB>=0?'ok':'bad'}">${r.incB>=0?'+':'−'} ${R(Math.abs(r.incB))}</span>`:'—'}</td><td class="n">${r&&r.roi!=null?`<b class="${r.roi>=0?'ok':'bad'}">${P(r.roi)}</b>`:'—'}</td></tr>`};
  return `<div class="head"><div><h1>Marketing</h1><p>Programação das ações, despesas e resultado em vendas</p></div><div class="acts"><button class="btn pri" data-act="editMkt">+ Ação</button></div></div>
  <div class="kpis">${kpi('Orçamento '+y,RK(orc),doAno.length+' ação(ões) no ano','hl')}${kpi('Gasto lançado '+y,RK(gasto),orc?P(gasto/orc*100)+' do orçamento':'')}${kpi('Em andamento',and.length,and.map(a=>h(a.nome)).slice(0,2).join(', '))}${kpi('Próximas',prox.length,prox[0]?h(prox[0].nome)+' em '+D(prox[0].ini):'nenhuma programada')}</div>
  ${as.length?`<div class="card"><h2>Ações</h2><div class="tw"><table><thead><tr><th>Ação</th><th>Período</th><th>Status</th><th class="n">Orçamento</th><th class="n">Gasto</th><th class="n">Vendas no período</th><th class="n">vs. período anterior</th><th class="n">Retorno</th></tr></thead><tbody>${as.map(linha).join('')}</tbody></table></div>
   <p class="note">Vendas = faturamento das lojas e modelos alvo durante a ação. “vs. período anterior” compara com o mesmo número de dias logo antes do início. Retorno = (margem de contribuição a mais − gasto) ÷ gasto. É uma leitura de tendência: outras coisas também mexem nas vendas.</p></div>`:`<div class="empty">Cadastre a primeira ação: tipo, período, lojas alvo, orçamento e meta. As despesas lançadas na ação vão direto para Contas a pagar.</div>`}`};
let PM=null;
ACT.editMkt=d=>{PM=d.id?JSON.parse(JSON.stringify(S.mkt.find(a=>a.id===d.id))):{id:null,nome:'',tipo:MKT_TIPOS[0],status:'planejada',ini:today(),fim:addDays(today(),30),alvo:'todas',ufs:'',gestores:[],pids:[],orc:'',meta:'',obs:'',resultado:'',despesas:[]};
  openModal(d.id?'Ação de marketing':'Nova ação de marketing',{wide:true,body:bodyMkt,onChange:e=>{lerMkt();if(['mk_alvo'].includes(e.target.id))drawModal();else atualizaMkt()},onInput:e=>{if(e.target.closest('#mkDesp')||e.target.id==='mk_gq'){lerMkt();if(e.target.id==='mk_gq')filtraG();else atualizaMkt()}},after:atualizaMkt,
   foot:()=>`${PM.id?'<button class="btn dng" data-act="delMkt">Excluir</button>':''}<span class="sp"></span><button class="btn" data-act="closeM">Cancelar</button><button class="btn pri" data-act="salvaMkt">Salvar ação</button>`})};
function bodyMkt(){const a=PM;const pago=x=>S.pagar.find(t=>t.origem==='mkt'&&t.key===x.id)?.pago;
  return `<div class="fg">${fld('mk_nome','Nome da ação',a.nome,{w:'w2',ph:'Ex.: Vitrine Dia das Crianças'})}${fld('mk_tipo','Tipo',0,{sel:MKT_TIPOS.map(x=>opt(x,x,a.tipo)).join('')})}${fld('mk_st','Status',0,{sel:Object.entries(MKT_ST).map(([k,v])=>opt(k,v[0],a.status)).join('')})}
   ${fld('mk_ini','Início',a.ini,{t:'date'})}${fld('mk_fim','Fim',a.fim,{t:'date'})}${fld('mk_orc','Orçamento (R$)',a.orc,{t:'number'})}${fld('mk_meta','Meta de vendas no período (R$)',a.meta,{t:'number'})}
   ${fld('mk_alvo','Lojas alvo',0,{sel:opt('todas','Todas as lojas',a.alvo)+opt('gestores','Gestores escolhidos',a.alvo)+opt('uf','Estados (UF)',a.alvo)})}${a.alvo==='uf'?fld('mk_ufs','UFs',a.ufs,{ph:'RJ, ES, MG'}):''}</div>
  ${a.alvo==='gestores'?`<div class="box"><div class="row"><h3 style="margin:0">Gestores (${(a.gestores||[]).length} marcados)</h3><input id="mk_gq" placeholder="Filtrar" style="max-width:220px"></div><div id="mkG" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:4px 12px;max-height:200px;overflow:auto;margin-top:8px">${S.gestores.slice().sort((x,y)=>x.nome.localeCompare(y.nome)).map(g=>`<label class="sm" data-n="${h(g.nome.toLowerCase())}"><input type="checkbox" class="mkg" value="${g.id}" ${(a.gestores||[]).includes(g.id)?'checked':''} style="width:auto"> ${h(g.nome)} <span class="mut">(${(g.lojas||[]).length})</span></label>`).join('')}</div></div>`:''}
  <div class="box"><h3>Modelos em foco <span class="mut" style="text-transform:none;letter-spacing:0">(nenhum marcado = todos)</span></h3><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px">${S.produtos.filter(p=>p.ativo!==false||(a.pids||[]).includes(p.id)).map(p=>`<label class="sm"><input type="checkbox" class="mkp" value="${p.id}" ${(a.pids||[]).includes(p.id)?'checked':''} style="width:auto"> ${h(p.nome)}</label>`).join('')||'<span class="note">Sem pelúcias cadastradas.</span>'}</div></div>
  <div class="box"><div class="row"><h3 style="margin:0">Despesas da ação</h3><button class="btn sm" data-act="mkAddD">+ Despesa</button></div>
   <div class="tw" style="margin-top:8px"><table><thead><tr><th>Descrição</th><th>Fornecedor</th><th class="n">Valor (R$)</th><th>Vencimento</th><th></th></tr></thead><tbody id="mkDesp">${(a.despesas||[]).map((x,j)=>{const pg=pago(x);return `<tr data-id="${x.id}"><td><input class="md" value="${h(x.desc)}" ${pg?'disabled':''} aria-label="Descrição"></td><td><input class="mf" value="${h(x.fav||'')}" ${pg?'disabled':''} aria-label="Fornecedor"></td><td class="n"><input class="pr mv" type="number" step="0.01" value="${x.valor||''}" ${pg?'disabled':''} aria-label="Valor"></td><td><input class="mvc" type="date" value="${x.venc||''}" ${pg?'disabled':''} aria-label="Vencimento"></td><td class="n">${pg?chip('Paga','c-ok'):`<button class="btn sm dng" data-act="mkDelD" data-j="${j}">×</button>`}</td></tr>`}).join('')||''}</tbody></table></div>
   <p class="note">Cada despesa entra em Contas a pagar (categoria Marketing) ao salvar a ação.</p></div>
  <div class="box"><h3>Resultado</h3><div id="mkRes"></div></div>
  <div class="fg">${fld('mk_obs','Descrição e programação (o que, onde, quem faz)',a.obs,{ta:1,w:'w2'})}${fld('mk_resu','Resultados e aprendizados',a.resultado,{ta:1,w:'w2',ph:'O que funcionou, fotos no Drive, retorno das lojas…'})}</div>`}
function filtraG(){const q=fv('mk_gq').toLowerCase();document.querySelectorAll('#mkG label').forEach(l=>l.hidden=q&&!l.dataset.n.includes(q))}
function lerMkt(){if(!$('#mk_nome'))return;const a=PM;Object.assign(a,{nome:fv('mk_nome').trim(),tipo:fv('mk_tipo'),status:fv('mk_st'),ini:fv('mk_ini'),fim:fv('mk_fim'),orc:n(fv('mk_orc')),meta:n(fv('mk_meta')),alvo:fv('mk_alvo'),obs:fv('mk_obs'),resultado:fv('mk_resu')});
  if($('#mk_ufs'))a.ufs=fv('mk_ufs');if($('#mkG'))a.gestores=[...document.querySelectorAll('.mkg:checked')].map(x=>x.value);a.pids=[...document.querySelectorAll('.mkp:checked')].map(x=>x.value);
  a.despesas=[...document.querySelectorAll('#mkDesp tr')].map(tr=>{const o=(PM.despesas||[]).find(x=>x.id===tr.dataset.id)||{id:tr.dataset.id};return {...o,desc:tr.querySelector('.md').value.trim(),fav:tr.querySelector('.mf').value.trim(),valor:n(tr.querySelector('.mv').value),venc:tr.querySelector('.mvc').value}})}
function atualizaMkt(){const r=mktResultado(PM);const el=$('#mkRes');if(!el)return;if(!r){el.innerHTML='<p class="note">Informe o período.</p>';return}
  const lj=mktLojas(PM);el.innerHTML=`<div class="kv" style="max-width:640px"><span>Lojas alvo</span><span>${lj?lj.length:allLojas().length}</span><span>Vendas no período da ação</span><span>${R(r.at.b)} · ${N(r.at.pc)} pç · ${r.at.ped} pedido(s)</span>
   ${r.meta?`<span>Meta</span><span>${R(r.meta)} · <b class="${r.at.b>=r.meta?'ok':'warn'}">${P(r.at.b/r.meta*100)} atingido</b></span>`:''}<span>Período anterior equivalente</span><span>${R(r.ant.b)} · ${N(r.ant.pc)} pç</span>
   <span>Vendas a mais</span><span class="${r.incB>=0?'ok':'bad'}">${r.incB>=0?'+':'−'} ${R(Math.abs(r.incB))}</span><span>Margem de contribuição a mais</span><span class="${r.incMC>=0?'ok':'bad'}">${r.incMC>=0?'+':'−'} ${R(Math.abs(r.incMC))}</span>
