/* ============ estoque ============ */
function calcEstoque(){
  const m={};const t=today();const c=S.cfg;
  S.produtos.forEach(p=>m[p.id]={saldo:0,cm:0,ent:false,res:0,comp:0,v90:0});
  const ms=[...S.movs].sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:a.seq-b.seq);
  let first=null;
  for(const v of ms){const r=m[v.pid];if(!r)continue;
    if(v.qtd>0&&v.tipo!=='ajuste'){r.cm=r.saldo>0?(r.saldo*r.cm+v.qtd*v.custo)/(r.saldo+v.qtd):v.custo;r.ent=true}
    r.saldo+=v.qtd;
    if(v.tipo==='saida'){if(!first||v.data<first)first=v.data;if(diffDays(v.data,t)<=90)r.v90-=v.qtd}
    if(v.tipo==='estorno'&&diffDays(v.data,t)<=90)r.v90-=v.qtd;}
  const div=first?Math.min(90,Math.max(30,diffDays(first,t))):90;
  S.pedidos.forEach(p=>{if(p.status==='confirmado'&&!p.baixado)(p.itens||[]).forEach(i=>{if(m[i.pid])m[i.pid].res+=n(i.qtd)})});
  S.compras.forEach(cp=>{if(['pedido','transito'].includes(cp.status))(cp.itens||[]).forEach(i=>{if(m[i.pid])m[i.pid].comp+=n(i.qtd)})});
  S.produtos.forEach(p=>{const r=m[p.id];if(!r.ent)r.cm=custoRef(p);
    r.disp=r.saldo-r.res;r.vDia=Math.max(0,r.v90)/div;r.cob=r.vDia>0?r.disp/r.vDia:Infinity;
    const lt=n(forn(p.fornecedorId)?.leadTime)||c.leadTime;
    r.pp=r.vDia*(lt+c.segDias);
    const cx=Math.max(1,n(p.caixaMaster)||1);
    const alvo=r.vDia*(lt+c.segDias+c.coberturaDias);
    r.sug=(r.vDia>0&&r.disp+r.comp<=r.pp)?Math.ceil(Math.max(0,alvo-r.disp-r.comp)/cx)*cx:0;
    r.baixo=r.disp<n(p.estMin)||(r.vDia>0&&r.disp+r.comp<=r.pp);});
  return m;
}

function landed(c){
  const its=(c.itens||[]).filter(i=>n(i.qtd)>0);const extra=n(c.frete)+n(c.outros);
  const w=i=>c.rateio==='valor'?n(i.qtd)*n(i.custo):c.rateio==='peso'?n(i.qtd)*(n(prod(i.pid)?.peso)||1):n(i.qtd);
  const W=sum(its,w)||1;const out={};
  its.forEach(i=>out[i.pid]=n(i.custo)+(extra*w(i)/W)/n(i.qtd));
  return {map:out,prod:sum(its,i=>n(i.qtd)*n(i.custo)),extra,pecas:sum(its,i=>n(i.qtd)),total:sum(its,i=>n(i.qtd)*n(i.custo))+extra};
}

  const rp=royPct();const roy=(c.royaltyBase==='liquida'?liq:bruto)*rp/100;
  const canal=p.canal||(p.repId?'representante':'direta');const rr=rep(p.repId);const comPct=canal!=='representante'?0:p.baixado&&p.comPct!=null?n(p.comPct):(rr?n(rr.comissao):n(c.comissaoPadrao));const com=bruto*comPct/100;const plat=canal==='b2b'?bruto*n(c.taxaB2B)/100:0;
  const freteEst=!(n(p.frete)>0);const frete=freteEst?bruto*n(c.freteSaidaPct)/100:n(p.frete);
  const arm=pecas*n(c.armazemPorPeca);const pm=N?30*(N+1)/2:prazoMedio(p.prazo);const tf=n(c.taxaFinMes)/100;
  const fin=p.parcelas&&p.parcelas.length&&p.faturadoEm?sum(p.parcelas,x=>x.antecip?n(x.custoAnt):n(x.liq??x.valor)*tf*Math.max(0,diffDays(p.faturadoEm,x.venc))/30):(bruto+acr)*tf*pm/30;
  const mc=lb-roy-com-frete-arm-fin-tax-plat+acr;

    itens:its.map(i=>{const b=n(i.qtd)*n(i.preco)*(1-fPct/100)*(1-n(p.desc)/100);const sh=bruto?b/bruto:0;const cm=n(i.qtd)*cu(i);

function baixar(p){
  E=calcEstoque();
  for(const i of p.itens){if(n(i.qtd)>0&&n(i.qtd)>E[i.pid].saldo)return `Estoque insuficiente de ${prod(i.pid)?.nome}: saldo ${N(E[i.pid].saldo)} peças.`}
  if(!p.faturadoEm)p.faturadoEm=today();
  const d0=dreCalc(p);p.comPct=d0.comPct;
  p.itens.forEach(i=>{if(n(i.qtd)>0){i.cmv=E[i.pid].cm;mov(i.pid,'saida',-n(i.qtd),i.cmv,p.faturadoEm,'Pedido '+p.num)}});
  p.baixado=true;
  if(d0.N){p.parcCartao=d0.N;p.prazo=[...Array(d0.N)].map((_,j)=>30*(j+1)).join('/')}
  const ds=dias(p.prazo),k=ds.length,tot=d0.bruto+d0.acr,base=r2(tot/k);
  p.parcelas=ds.map((d,j)=>{const v=j===k-1?r2(tot-base*(k-1)):base;const mdr=d0.N?r2(v*d0.tN/100):p.formaPag==='boleto'?n(S.cfg.tarifaBoleto):0;
    return {id:uid(),venc:addDays(p.faturadoEm,d),valor:v,mdr,liq:r2(v-mdr),cartao:!!d0.N,pago:false,pagoEm:'',antecip:false,custoAnt:0}});
  if(n(p.frete)>0)S.pagar.push({id:uid(),origem:'frete',ref:p.id,desc:'Frete do pedido '+p.num,fav:p.transp||'Transportadora',cat:'Frete de venda',venc:addDays(p.faturadoEm,n(S.cfg.diasFreteVenda)),valor:n(p.frete),pago:false,pagoEm:''});
  return null;
}

function syncPagarCompra(c){
  const mine=S.pagar.filter(t=>t.origem==='compra'&&t.ref===c.id);
  if(mine.some(t=>t.pago))return;
  S.pagar=S.pagar.filter(t=>!(t.origem==='compra'&&t.ref===c.id));
  if(['cotacao','cancelado'].includes(c.status))return;
  const L=landed(c);const f=forn(c.fornecedorId);const ds=dias(c.condPag),k=ds.length,base=r2(L.prod/k);
  ds.forEach((d,j)=>S.pagar.push({id:uid(),origem:'compra',ref:c.id,desc:`Compra ${c.num} – parcela ${j+1}/${k}`,fav:f?.nome||'Fornecedor',cat:'Compra de mercadoria',venc:addDays(c.data,d),valor:j===k-1?r2(L.prod-base*(k-1)):base,pago:false,pagoEm:''}));
  if(L.extra>0)S.pagar.push({id:uid(),origem:'compra',ref:c.id,desc:`Frete/despesas da compra ${c.num}`,fav:c.favFrete||'Frete / despachante',cat:'Frete de compra',venc:c.previsao||addDays(c.data,30),valor:r2(L.extra),pago:false,pagoEm:''});

function syncMG(ct){

}
function royPeriodos(ct){
  if(!ct||!ct.inicio)return [];
  const step=ct.periodicidade==='trimestral'?3:1;const fim=ct.fim||addMonths(ct.inicio,12);
  const fat=pedFat();const out=[];let ini=ct.inicio,cumE=0,prevTop=0;
  while(ini<=fim&&out.length<60){
    let end=addDays(addMonths(ini,step),-1);if(end>fim)end=fim;
    const ps=fat.filter(p=>p.faturadoEm>=ini&&p.faturadoEm<=end);
    const vend=sum(ps,p=>dreCalc(p).bruto);const ear=sum(ps,p=>dreCalc(p).roy);cumE+=ear;
    const cumMG=sum((ct.mgParcelas||[]).filter(x=>x.venc&&x.venc<=end),x=>n(x.valor));
    const top=Math.max(0,cumE-cumMG-prevTop);prevTop+=top;
    const lanc=S.pagar.find(t=>t.origem==='royexc'&&t.ref===ct.id&&t.key===ini);
    out.push({ini,end,ped:ps.length,vend,ear,cumE,cumMG,top,lanc,fechado:end<today()});
    ini=addDays(end,1);}
  return out;
}

  const vendNec=pct?mg/(pct/100):0;const mesesTot=monthsSpan(ct.inicio,fim);const t=today();

}

  $('#modal').innerHTML=`<div class="ov" data-act="ovClose"><div class="mbox ${o.wide?'wide':''}" role="dialog" aria-modal="true"><div class="mh"><h2>${o.title}</h2><button class="x" data-act="closeM" aria-label="Fechar">×</button></div><div class="mb">${o.body()}</div><div class="mf">${o.foot?o.foot():''}</div></div></div>`;
  if($('.ov'))$('.ov').scrollTop=sc;
  o.after&&o.after();}
function closeModal(){MODAL=null;$('#modal').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MODAL)closeModal()});
const fv=id=>{const e=document.getElementById(id);return e?e.value:''};

/* ============ componentes ============ */
const kpi=(l,v,s='',cls='')=>`<div class="kpi ${cls}"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
const chip=(t,c='')=>`<span class="chip ${c}">${t}</span>`;
const ST_P={orcamento:['Orçamento',''],confirmado:['Confirmado','c-warn'],faturado:['Faturado','c-gold'],entregue:['Entregue','c-info'],pago:['Pago','c-ok'],cancelado:['Cancelado','c-bad']};
const ST_C={cotacao:['Cotação',''],pedido:['Pedido feito','c-warn'],transito:['Em trânsito','c-info'],recebido:['Recebido','c-ok'],cancelado:['Cancelado','c-bad']};
const stP=s=>chip(...(ST_P[s]||[s]));const stC=s=>chip(...(ST_C[s]||[s]));
const thumb=p=>p?.foto?`<img class="thumb" src="${p.foto}" alt="">`:`<span class="thumb">${h((p?.cod||'').slice(0,4))}</span>`;
const opt=(v,l,sel)=>`<option value="${h(v)}" ${String(v)===String(sel)?'selected':''}>${h(l)}</option>`;
const fld=(id,l,v,o={})=>`<div class="f ${o.w||''}"><label for="${id}">${l}</label>${o.sel?`<select id="${id}" ${o.dis?'disabled':''}>${o.sel}</select>`:o.ta?`<textarea id="${id}">${h(v)}</textarea>`:`<input id="${id}" type="${o.t||'text'}" ${o.t==='number'?'step="any" inputmode="decimal"':''} value="${h(v??'')}" ${o.ph?`placeholder="${h(o.ph)}"`:''} ${o.dis?'disabled':''}>`}${o.hint?`<span class="note">${o.hint}</span>`:''}</div>`;
const mbar=(v,max,cls='')=>`<div class="bar ${cls}"><i style="width:${Math.max(0,Math.min(100,max?v/max*100:0))}%"></i></div>`;

/* ============ VIEWS ============ */
const VIEWS={},ACT={};

/* ============ vendas do dia / semana / mês ============ */
const DSEM=['seg','ter','qua','qui','sex','sáb','dom'];
function semanaDe(t){const dw=(pd(t).getDay()+6)%7;const ini=addDays(t,-dw);return {ini,fim:addDays(ini,6),dw}}
function vendasLoj(ini,fim){const ps=pedFat().filter(p=>p.faturadoEm>=ini&&p.faturadoEm<=fim);return {v:sum(ps,p=>dreCalc(p).bruto),q:sum(ps,p=>dreCalc(p).pecas),n:ps.length,l:new Set(ps.map(p=>p.lojaId)).size}}
function vendasPdv(ini,fim){const ss=allSellout().filter(x=>x.data>=ini&&x.data<=fim);return {v:sum(ss,x=>n(x.valor)),q:sum(ss,x=>n(x.qtd)),n:ss.length,l:new Set(ss.map(x=>x.lojaId)).size}}
function blocoVendas(tipo){const t=today(),mes=mkey(t),w=semanaDe(t);const f=tipo==='pdv'?vendasPdv:vendasLoj;
  const var_=(a,b)=>{if(!b)return a?'<span class="chip c-info">sem base</span>':'';const v=(a-b)/b*100;return `<span class="${v>=0?'ok':'bad'}">${v>=0?'▲':'▼'} ${P(Math.abs(v))}</span>`};
  const dia=f(t,t),diaA=f(addDays(t,-7),addDays(t,-7)),sem=f(w.ini,t),semA=f(addDays(w.ini,-7),addDays(t,-7)),me=f(mes+'-01',t);
  const dAnt=+t.slice(8)-1;const mA0=nextMonthKey(mes,-1)+'-01';const mA=f(mA0,addDays(mA0,Math.min(dAnt,+lastDay(nextMonthKey(mes,-1)).slice(8)-1)));
  const dias=[...Array(7)].map((_,i)=>{const d=addDays(w.ini,i);return {d,lbl:DSEM[i],x:d<=t?f(d,d):null}});const mx=Math.max(1,...dias.map(x=>x.x?x.x.v:0));
  const sub=x=>tipo==='pdv'?`${N(x.q)} pç vendidas · ${x.l} loja(s)`:`${N(x.q)} pç · ${x.n} pedido(s)`;
  const sem_dados=tipo==='pdv'&&!allSellout().length;
  const col=(l,x,vs,cmp)=>`<div class="vbx"><div class="l">${l}</div><div class="v">${RK(x.v)}</div><div class="s">${sub(x)}</div><div class="s">${var_(x.v,vs.v)} <span class="mut">${cmp}</span></div></div>`;
  return `<div class="card"><h2>${tipo==='pdv'?'Vendas nas lojas (PDV)':'Vendas aos lojistas'} <span class="sm mut">${tipo==='pdv'?'sell-out ao consumidor':'faturamento'}</span></h2>
   ${sem_dados?`<p class="note">Assim que o PDV das lojas estiver integrado (ou você importar um relatório em Sell-out), aqui aparecem as vendas ao consumidor de hoje, da semana e do mês, comparadas com os períodos anteriores.</p>`:`<div class="vgrid">${col('Hoje · '+DSEM[w.dw],dia,diaA,'vs. '+DSEM[w.dw]+' passada')}${col(`Semana · ${D(w.ini).slice(0,5)} a ${D(w.fim).slice(0,5)}`,sem,semA,'vs. mesmos dias da semana passada')}${col('Mês · '+ML(mes),me,mA,'vs. mesmo período do mês passado')}</div>
   <div class="wbars">${dias.map((x,i)=>`<div class="wb ${i===w.dw?'hoje':''} ${x.x?'':'fut'}"><small>${x.x&&x.x.v?RK(x.x.v).replace('R$ ',''):''}</small><div class="wt"><i style="height:${x.x?Math.max(2,x.x.v/mx*100):0}%"></i></div><small>${x.lbl}</small></div>`).join('')}</div>`}</div>`}
VIEWS.painel=()=>{
  const t=today(),mes=mkey(t);const fat=pedFat();const dm=sumDre(fat.filter(p=>mkey(p.faturadoEm)===mes));
  const est=S.produtos.reduce((a,p)=>{const r=E[p.id];if(r.saldo>0){a.q+=r.saldo;a.v+=r.saldo*r.cm}return a},{q:0,v:0});
  const rec=receberLista().filter(o=>!o.x.pago);const recV=sum(rec,o=>n(o.x.liq??o.x.valor)),recVenc=sum(rec.filter(o=>o.x.venc<t),o=>n(o.x.liq??o.x.valor));
  const pag=S.pagar.filter(x=>!x.pago);const pag30=sum(pag.filter(x=>x.venc<=addDays(t,30)),x=>x.valor),pagVenc=sum(pag.filter(x=>x.venc<t),x=>x.valor);
  const ab=S.pedidos.filter(p=>['orcamento','confirmado'].includes(p.status));
  const lic=licAtiva(),rr=royResumo(lic);
  const lojas=allLojas();const posit=new Set(fat.map(p=>p.lojaId));
  const meses=[...Array(6)].map((_,i)=>nextMonthKey(mes,i-5));
  const md=meses.map(k=>sumDre(fat.filter(p=>mkey(p.faturadoEm)===k)));const mx=Math.max(1,...md.map(d=>d.bruto));
  const top=S.produtos.map(p=>({p,q:sum(fat.flatMap(x=>x.itens).filter(i=>i.pid===p.id),i=>n(i.qtd))})).filter(x=>x.q>0).sort((a,b)=>b.q-a.q).slice(0,6);const tq=Math.max(1,...top.map(x=>x.q));
  const baixo=S.produtos.filter(p=>p.ativo!==false&&E[p.id].baixo);
  const repo=lojas.map(o=>{const ps=fat.filter(p=>p.lojaId===o.l.id).sort((a,b)=>b.faturadoEm.localeCompare(a.faturadoEm));return {...o,u:ps[0]}}).filter(o=>o.u&&diffDays(o.u.faturadoEm,t)>=n(S.cfg.diasReposicao)).sort((a,b)=>a.u.faturadoEm.localeCompare(b.u.faturadoEm));
  const ctv=S.contratos.filter(c=>c.fim&&c.fim>=t&&diffDays(t,c.fim)<=60);
  return `<div class="head"><div><h1>Painel</h1><p>${ML(mes)} · operação de pelúcias licenciadas</p></div><div class="acts"><button class="btn" data-act="atualizar">↻ Atualizar</button><button class="btn pri" data-act="novoPedido">+ Novo pedido</button></div></div>
  <div class="cols">${blocoVendas('loj')}${blocoVendas('pdv')}</div>
  <div class="kpis">
   ${kpi('Faturado no mês',RK(dm.bruto),`${dm.n} pedido(s) · ${N(dm.pecas)} peças`,'hl')}
   ${kpi('Margem de contribuição',RK(dm.mc),dm.bruto?P(dm.mcp)+' da receita':'sem vendas no mês')}
   ${rr?kpi('Mínimo garantido',P(rr.ating),`royalties gerados ${RK(rr.ear)} de ${RK(rr.mg)}`):kpi('Royalties do mês',RK(dm.roy),'cadastre o contrato de licença')}
   ${kpi('A receber',RK(recV),recVenc?`<span class="bad">${RK(recVenc)} vencido</span>`:'nada vencido')}
   ${kpi('A pagar em 30 dias',RK(pag30),pagVenc?`<span class="bad">${RK(pagVenc)} vencido</span>`:'nada vencido')}
   ${kpi('Estoque Bloco 39',N(est.q)+' pç',`${RK(est.v)} a custo · ${RK(est.v*n(S.cfg.taxaFinMes)/100)}/mês de custo de capital`)}
  </div>
  ${rr?`<div class="card"><h2>Royalty mínimo garantido <span class="chip c-gold">${D(lic.inicio)} a ${D(rr.fim)}</span></h2>
   <div class="row"><span class="mut sm">Para cobrir o mínimo de ${R(rr.mg)} é preciso vender ${R(rr.vendNec)} no período (${P(rr.pct)}).</span><span class="sm">Vendido: <b>${R(rr.vend)}</b></span></div>
   <div style="margin:10px 0">${mbar(rr.vend,rr.vendNec,rr.ating>=100?'ok':'')}</div>
   <div class="note">${rr.falta>0?`Faltam <b class="gold">${R(rr.falta)}</b> em vendas, cerca de <b>${R(rr.mesNec)}</b> por mês nos ${rr.mesesRest} meses restantes. Abaixo disso, a diferença do mínimo é custo sem venda correspondente.`:'<span class="ok">Mínimo coberto. A partir daqui os royalties excedentes são pagos sobre as vendas.</span>'}</div></div>`:''}
  <div class="cols">
   <div class="card"><h2>Faturamento e margem <span class="sm mut">últimos 6 meses</span></h2>
    <div class="cbars">${md.map((d,i)=>`<div class="cb"><small>${d.bruto?RK(d.bruto).replace('R$ ',''):''}</small><div class="stk"><i class="a" style="height:${d.bruto/mx*100}%"></i><i class="b" style="height:${Math.max(0,d.mc)/mx*100}%"></i></div><small>${ML(meses[i])}</small></div>`).join('')}</div>
    <div class="note" style="margin-top:8px">Barra cinza: receita bruta · barra dourada: margem de contribuição</div></div>
   <div class="card"><h2>Modelos mais vendidos</h2>${top.length?top.map(x=>`<div class="hb"><span>${h(x.p.nome)}</span>${mbar(x.q,tq)}<span class="num">${N(x.q)} pç</span></div>`).join(''):'<div class="note">As vendas faturadas aparecem aqui.</div>'}</div>
  </div>
  <div class="cols">
   <div class="card"><h2>Mapeamento dos lojistas</h2>
    <div class="kv"><span>Gestores cadastrados</span><span>${S.gestores.length}</span><span>Lojas (CNPJs) cadastradas</span><span>${lojas.length} de ${S.cfg.totalRede}</span><span>Lojas que já compraram</span><span>${posit.size}</span></div>
    <div style="margin-top:10px">${mbar(lojas.length,n(S.cfg.totalRede))}</div>
    <h3 style="margin-top:16px">Lojas para reposição (${n(S.cfg.diasReposicao)}+ dias sem pedido)</h3>
    ${repo.length?repo.slice(0,6).map(o=>`<div class="row sm" style="padding:4px 0"><span>${h(o.l.nome)} <span class="mut">· ${h(o.g.nome)}</span></span><span class="mut">${diffDays(o.u.faturadoEm,t)} dias <button class="btn sm" data-act="repetir" data-l="${o.l.id}">Repor</button></span></div>`).join(''):'<div class="note">Nenhuma loja passou do prazo de reposição.</div>'}
   </div>
   <div class="card"><h2>Pontos de atenção</h2>
    ${baixo.length?`<h3>Estoque para repor</h3>`+baixo.map(p=>`<div class="row sm" style="padding:3px 0"><span>${h(p.nome)}</span><span class="warn">${N(E[p.id].disp)} disponíveis${E[p.id].sug?` · sugerido comprar ${N(E[p.id].sug)}`:''}</span></div>`).join(''):''}
    ${ctv.length?`<h3 style="margin-top:12px">Contratos vencendo em 60 dias</h3>`+ctv.map(c=>`<div class="row sm"><span>${h(c.titulo)}</span><span class="warn">${D(c.fim)}</span></div>`).join(''):''}
    ${recVenc||pagVenc?`<h3 style="margin-top:12px">Financeiro</h3>${recVenc?`<div class="row sm"><span>Recebimentos vencidos</span><a class="bad" href="#receber">${R(recVenc)}</a></div>`:''}${pagVenc?`<div class="row sm"><span>Pagamentos vencidos</span><a class="bad" href="#pagar">${R(pagVenc)}</a></div>`:''}`:''}
    ${!baixo.length&&!ctv.length&&!recVenc&&!pagVenc?'<div class="note">Tudo em dia.</div>':''}
    ${ab.length?`<h3 style="margin-top:12px">Pedidos em aberto</h3><div class="row sm"><span>${ab.length} orçamento(s)/confirmado(s)</span><a href="#pedidos">${R(sum(ab,p=>dreCalc(p).bruto))}</a></div>`:''}
   </div>
  </div>`;
};

VIEWS.pedidos=()=>{
  const f=UI.pedSt;const t=today();
  const grp={abertos:p=>['orcamento','confirmado'].includes(p.status),faturados:p=>['faturado','entregue'].includes(p.status),pagos:p=>p.status==='pago',cancelados:p=>p.status==='cancelado',todos:()=>true};
  const cnt=k=>S.pedidos.filter(grp[k]).length;
  const ls=S.pedidos.filter(grp[f]).sort((a,b)=>b.num-a.num);
  const tot=sumDre(ls.filter(p=>p.status!=='cancelado'));
  return `<div class="head"><div><h1>Pedidos</h1><p>Vendas aos lojistas oficiais, por loja (CNPJ)</p></div><div class="acts"><button class="btn pri" data-act="novoPedido">+ Novo pedido</button></div></div>
  <div class="seg">${[['abertos','Em aberto'],['faturados','Faturados'],['pagos','Pagos'],['cancelados','Cancelados'],['todos','Todos']].map(([k,l])=>`<button class="${f===k?'on':''}" data-act="pedSt" data-k="${k}">${l} · ${cnt(k)}</button>`).join('')}</div>
  <div class="card"><div class="tw"><table><thead><tr><th>Nº</th><th>Data</th><th>Gestor › Loja</th><th>Canal</th><th>Pagamento</th><th class="n">Peças</th><th class="n">Valor</th><th class="n">Margem</th><th>Status</th></tr></thead><tbody>
  ${ls.map(p=>{const o=lojaById(p.lojaId);const d=dreCalc(p);return `<tr class="click" data-act="abrirPedido" data-id="${p.id}"><td>${p.num}</td><td>${D(p.data)}</td><td>${h(o?.g.nome||'—')} › <b>${h(o?.l.nome||'—')}</b></td><td>${chip(CANAIS[d.canal],d.canal==='b2b'?'c-info':d.canal==='direta'?'c-gold':'')}${p.repId?`<div class="sm mut">${h(rep(p.repId)?.nome||'')}</div>`:''}</td><td>${chip(FORMAS[p.formaPag||'boleto']+(p.formaPag==='cartao'?' '+(d.N||1)+'x':''),p.formaPag==='pix'?'c-ok':p.formaPag==='cartao'?'c-info':'')} ${p.formaPag==='cartao'?'':`<span class="sm mut">${h(p.prazo||'')}</span>`}</td><td class="n">${N(d.pecas)}</td><td class="n">${R(d.bruto)}</td><td class="n ${d.mc<0?'bad':''}">${P(d.mcp)}</td><td>${stP(p.status)}</td></tr>`}).join('')||`<tr><td colspan="9" class="mut">Nenhum pedido aqui.</td></tr>`}
  </tbody>${ls.length?`<tfoot><tr><td colspan="5">Total (sem cancelados)</td><td class="n">${N(tot.pecas)}</td><td class="n">${R(tot.bruto)}</td><td class="n">${P(tot.mcp)}</td><td></td></tr></tfoot>`:''}</table></div></div>`;
};

VIEWS.lojistas=()=>{
  const q=UI.q.toLowerCase();const fat=pedFat();
  const gs=S.gestores.filter(g=>!q||[g.nome,g.grupo,...(g.lojas||[]).flatMap(l=>[l.nome,l.cnpj,fmtCNPJ(l.cnpj),l.cidade,l.uf,l.razao,l.comprador?.nome])].join(' ').toLowerCase().includes(q)).sort((a,b)=>UI.lojOrd==='az'?a.nome.localeCompare(b.nome):((b.lojas||[]).length-(a.lojas||[]).length)||(n(b.qtdLojas)-n(a.qtdLojas))||a.nome.localeCompare(b.nome));
  const lojas=allLojas();const posit=new Set(fat.map(p=>p.lojaId));

  <div class="row"><input id="busca" data-chg="busca" placeholder="Buscar gestor, loja, CNPJ, razão social ou cidade" value="${h(UI.q)}" style="flex:1;min-width:220px"><div class="seg"><span class="sm mut" style="align-self:center">Ordenar:</span>${[['lojas','Mais lojas'],['az','A–Z']].map(([k,l])=>`<button class="${UI.lojOrd===k?'on':''}" data-act="lojOrd" data-v="${k}">${l}</button>`).join('')}</div></div>
  <div class="list">${gs.map(g=>{const ls=g.lojas||[];const op=UI.open.has(g.id);const vend=sum(fat.filter(p=>ls.some(l=>l.id===p.lojaId)),p=>dreCalc(p).bruto);const inf=Math.max(n(g.qtdLojas),ls.length);
   return `<div class="gcard"><div class="gh" data-act="togG" data-id="${g.id}"><div><b>${h(g.nome)}</b> ${g.grupo?`<span class="mut">· ${h(g.grupo)}</span>`:''}<div class="sm mut">${h([g.telefone,g.cidade&&g.cidade+(g.uf?'/'+g.uf:''),rep(g.repId)?.nome&&'Rep.: '+rep(g.repId).nome].filter(Boolean).join(' · '))}</div></div>
    <div class="row" style="gap:8px">${chip(`${ls.length} de ${inf||'?'} lojas`,ls.length<inf?'c-warn':'c-ok')}${g.status==='prospect'?chip('Prospecção','c-info'):g.status==='inativo'?chip('Inativo','c-bad'):''}${vend?chip(RK(vend)+' comprado','c-gold'):''}<span class="mut">${op?'▴':'▾'}</span></div></div>
    ${op?`<div class="gb"><div class="tw"><table><thead><tr><th>Loja</th><th>CNPJ</th><th>Cidade</th><th>Potencial</th><th>Último pedido</th><th class="n">Comprado</th><th></th></tr></thead><tbody>
     ${ls.map(l=>{const ps=fat.filter(p=>p.lojaId===l.id).sort((a,b)=>b.faturadoEm.localeCompare(a.faturadoEm));return `<tr><td><b>${h(l.nome)}</b>${l.status==='inativa'?' '+chip('Inativa','c-bad'):''}${l.razao?`<div class="sm mut">${h(l.razao)}</div>`:''}${l.comprador?.nome?`<div class="sm mut">Comprador: ${h(l.comprador.nome)}${l.comprador.tel?' · '+h(l.comprador.tel):''}</div>`:''}</td><td class="num">${h(fmtCNPJ(l.cnpj))||'<span class="warn">sem CNPJ</span>'} ${l.cnpj&&!cnpjOk(l.cnpj)?chip('CNPJ inválido','c-bad'):''}</td><td>${h(l.cidade||'')}${l.uf?'/'+h(l.uf):''}</td><td>${chip(l.pot||'B','c-gold')}</td><td>${ps[0]?D(ps[0].faturadoEm):'<span class="mut">nunca</span>'}</td><td class="n">${R(sum(ps,p=>dreCalc(p).bruto))}</td><td class="n"><button class="btn sm" data-act="novoPedido" data-l="${l.id}">Pedido</button> <button class="btn sm" data-act="editLoja" data-g="${g.id}" data-id="${l.id}">Editar</button></td></tr>`}).join('')||'<tr><td colspan="7" class="mut">Nenhuma loja cadastrada para este gestor ainda.</td></tr>'}
     </tbody></table></div><div class="acts" style="margin-top:10px"><button class="btn sm pri" data-act="editLoja" data-g="${g.id}">+ Loja / CNPJ</button><button class="btn sm" data-act="editGestor" data-id="${g.id}">Editar gestor</button></div>${g.obs?`<p class="note">${h(g.obs)}</p>`:''}</div>`:''}</div>`}).join('')||`<div class="empty">Nenhum gestor ${q?'encontrado':'cadastrado'}. Comece por <b>+ Gestor</b> ou importe uma lista.</div>`}</div>`;
};

VIEWS.pelucias=()=>{
  const ps=[...S.produtos].sort((a,b)=>(a.ativo===false)-(b.ativo===false)||a.cod.localeCompare(b.cod));
  return `<div class="head"><div><h1>Pelúcias</h1><p>${S.produtos.filter(p=>p.ativo!==false).length} modelos ativos · custo, preço ao lojista e margem por peça</p></div><div class="acts"><button class="btn pri" data-act="editProd">+ Modelo</button></div></div>

   <tfoot><tr><td>${its.length} modelos · loja B</td><td class="n">${N(sum(its,i=>n(i.qtd)))}</td><td colspan="2" class="n">${R(val)}</td></tr></tfoot></table></div>

function arred(q,p){const m=Math.max(1,n(p?.multVenda)||1);q=n(q);if(q<=0)return 0;return Math.max(m,Math.round(q/m)*m)}

VIEWS.receber=()=>{
  const t=today(),f=UI.recF;const all=receberLista();const lq=o=>n(o.x.liq??o.x.valor);
  const flt={abertos:o=>!o.x.pago,vencidos:o=>!o.x.pago&&o.x.venc<t,cartao:o=>!o.x.pago&&o.x.cartao,recebidos:o=>o.x.pago,todos:()=>true};
  const ls=all.filter(flt[f]).sort((a,b)=>a.x.venc.localeCompare(b.x.venc));
  const ab=all.filter(o=>!o.x.pago);const cart=ab.filter(o=>o.x.cartao);
  const ant=cart.map(o=>antCalc(o.x));const antL=sum(ant,a=>a.liq),antC=sum(ant,a=>a.custo);
  const antes=all.filter(o=>o.x.antecip);
  return `<div class="head"><div><h1>Contas a receber</h1><p>Parcelas geradas no faturamento. Cartão: 1 parcela a cada 30 dias, já descontado o MDR.</p></div></div>
  <div class="kpis">${kpi('Em aberto (líquido)',RK(sum(ab,lq)),ab.length+' parcelas · bruto '+RK(sum(ab,o=>o.x.valor)),'hl')}${kpi('Vencido',RK(sum(ab.filter(o=>o.x.venc<t),lq)))}${kpi('Próximos 30 dias',RK(sum(ab.filter(o=>o.x.venc>=t&&o.x.venc<=addDays(t,30)),lq)))}${kpi('Recebido no mês',RK(sum(all.filter(o=>o.x.pago&&mkey(o.x.pagoEm)===mkey(t)),o=>o.x.antecip?lq(o)-n(o.x.custoAnt):lq(o))))}</div>
  ${cart.length?`<div class="card"><h2>Antecipação dos recebíveis do cartão <span class="chip c-gold">${P(n(S.cfg.taxaAntecipacao))} a cada 30 dias</span></h2>
   <div class="kv" style="max-width:520px"><span>Parcelas de cartão a receber</span><span>${cart.length}</span><span>Valor líquido (já sem MDR)</span><span>${R(antL)}</span><span>Custo da antecipação hoje</span><span class="bad">− ${R(antC)}</span><span><b>Você recebe hoje</b></span><span class="gold"><b>${R(antL-antC)}</b></span></div>
   <div class="row" style="margin-top:12px"><span class="note">Custo de cada parcela = líquido × ${P(n(S.cfg.taxaAntecipacao))} × dias até o vencimento ÷ 30. A taxa fica em Ajustes.</span><button class="btn pri sm" data-act="antTodas">Antecipar todas</button></div></div>`:''}
  <div class="seg">${[['abertos','Em aberto'],['vencidos','Vencidos'],['cartao','Cartão a receber'],['recebidos','Recebidos'],['todos','Todos']].map(([k,l])=>`<button class="${f===k?'on':''}" data-act="recF" data-k="${k}">${l}</button>`).join('')}</div>
  <div class="card"><div class="tw"><table><thead><tr><th>Vencimento</th><th>Loja</th><th>Pedido</th><th>Parcela</th><th class="n">Valor</th><th class="n">MDR / tarifa</th><th class="n">Líquido</th><th>Situação</th><th></th></tr></thead><tbody>
  ${ls.map(o=>{const L=lojaById(o.p.lojaId);const venc=!o.x.pago&&o.x.venc<t;const a=o.x.cartao&&!o.x.pago?antCalc(o.x):null;
   return `<tr><td>${D(o.x.venc)}</td><td><b>${h(L?.l.nome||'—')}</b><div class="sm mut">${h(L?.g.nome||'')} · ${h(fmtCNPJ(L?.l.cnpj||''))}</div></td><td><a href="#pedidos" data-act="abrirPedido" data-id="${o.p.id}">${o.p.num}</a>${o.p.nf?` <span class="mut sm">NF ${h(o.p.nf)}</span>`:''}<div class="sm mut">${FORMAS[o.p.formaPag||'boleto']}${o.x.cartao?' '+o.n+'x':''}</div></td><td>${o.j+1}/${o.n}</td>
   <td class="n">${R(o.x.valor)}</td><td class="n mut">${n(o.x.mdr)?'− '+R(o.x.mdr):'—'}</td><td class="n"><b>${R(lq(o))}</b>${a?`<div class="sm mut">antecipando hoje: ${R(a.hoje)}</div>`:''}${o.x.antecip?`<div class="sm bad">antecipação − ${R(o.x.custoAnt)}</div>`:''}</td>
   <td>${o.x.pago?chip((o.x.antecip?'Antecipado ':'Recebido ')+D(o.x.pagoEm),'c-ok'):venc?chip(diffDays(o.x.venc,t)+' d vencida','c-bad'):chip('A vencer')}</td>
   <td class="n">${o.x.pago?`<button class="btn sm" data-act="recUndo" data-p="${o.p.id}" data-x="${o.x.id}">Estornar</button>`:`${a?`<button class="btn sm" data-act="antUma" data-p="${o.p.id}" data-x="${o.x.id}">Antecipar</button> `:''}<button class="btn sm pri" data-act="recOk" data-p="${o.p.id}" data-x="${o.x.id}">Receber</button>`}</td></tr>`}).join('')||'<tr><td colspan="9" class="mut">Nada aqui.</td></tr>'}
  </tbody>${ls.length?`<tfoot><tr><td colspan="4">${ls.length} parcela(s)</td><td class="n">${R(sum(ls,o=>o.x.valor))}</td><td class="n">− ${R(sum(ls,o=>n(o.x.mdr)))}</td><td class="n">${R(sum(ls,lq))}</td><td colspan="2"></td></tr></tfoot>`:''}</table></div>
  ${antes.length?`<p class="note">Antecipações feitas: ${antes.length} parcela(s), custo total ${R(sum(antes,o=>n(o.x.custoAnt)))} (entra no DRE como custo financeiro).</p>`:''}</div>`;
};
function antCalc(x){const d=Math.max(0,diffDays(today(),x.venc));const liq=n(x.liq??x.valor);const custo=r2(liq*n(S.cfg.taxaAntecipacao)/100*d/30);return {dias:d,liq,custo,hoje:r2(liq-custo)}}
function antecipar(p,x){const a=antCalc(x);x.pago=true;x.pagoEm=today();x.antecip=true;x.custoAnt=a.custo;if(p.parcelas.every(y=>y.pago)){p.status='pago';p.pagoEm=today()}return a}
ACT.antUma=d=>{const p=S.pedidos.find(x=>x.id===d.p);const x=p.parcelas.find(y=>y.id===d.x);const a=antecipar(p,x);save();render();toast(`Antecipado: ${R(a.hoje)} hoje (custo ${R(a.custo)})`,'okk')};
ACT.antTodas=(d,b)=>{if(!armed(b,'Confirmar antecipação'))return;let h_=0,c_=0;receberLista().filter(o=>!o.x.pago&&o.x.cartao).forEach(o=>{const a=antecipar(o.p,o.x);h_+=a.hoje;c_+=a.custo});save();render();toast(`Antecipado ${R(h_)} (custo ${R(c_)})`,'okk')};

VIEWS.fluxo=()=>{
  const t=today(),m0=mkey(t);const ms=[...Array(6)].map((_,i)=>nextMonthKey(m0,i));
  const rec=receberLista().filter(o=>!o.x.pago).map(o=>({venc:o.x.venc,v:n(o.x.liq??o.x.valor)}));const pag=S.pagar.filter(x=>!x.pago).map(x=>({venc:x.venc,v:x.valor}));
  const col=k=>({e:sum(rec.filter(x=>k==='venc'?x.venc<t:mkey(x.venc)===k&&x.venc>=t),x=>x.v),s:sum(pag.filter(x=>k==='venc'?x.venc<t:mkey(x.venc)===k&&x.venc>=t),x=>x.v)});
  const cols=[['venc','Vencidos'],...ms.map(k=>[k,ML(k)])].map(([k,l])=>({l,...col(k)}));
  let acc=n(S.cfg.saldoCaixa);cols.forEach(c=>{acc+=c.e-c.s;c.acc=acc});
  const mx=Math.max(1,...cols.map(c=>Math.max(c.e,c.s)));
  return `<div class="head"><div><h1>Fluxo de caixa</h1><p>Previsto a partir das contas a receber e a pagar em aberto</p></div>

  <tr><td>Entradas (lojistas)</td>${cols.map(c=>`<td class="n ok">${R(c.e)}</td>`).join('')}</tr>
  <tr><td>Saídas (contas a pagar)</td>${cols.map(c=>`<td class="n bad">${R(c.s)}</td>`).join('')}</tr>

  </tbody></table></div>

VIEWS.royalties=()=>{

  if(!ct)return `<div class="head"><div><h1>Royalties</h1><p>Cálculo do royalty devido ao clube e do mínimo garantido</p></div></div><div class="empty">Cadastre o contrato de licença com o Flamengo em <a href="#contratos">Contratos</a> (tipo “Licença”), com o percentual, o mínimo garantido e as parcelas. A partir dele o sistema calcula tudo.</div>`;
  const rr=royResumo(ct);const per=royPeriodos(ct);
  return `<div class="head"><div><h1>Royalties</h1><p>${h(ct.titulo)} · ${P(rr.pct)} sobre ${S.cfg.royaltyBase==='liquida'?'receita líquida':'o valor vendido aos lojistas'} · ${ct.periodicidade==='trimestral'?'relatório trimestral':'relatório mensal'}</p></div>${ls.length>1?`<span class="chip">${ls.length} contratos de licença</span>`:''}</div>
  <div class="kpis">${kpi('Mínimo garantido',RK(rr.mg),`${(ct.mgParcelas||[]).length} parcela(s) · ${D(ct.inicio)} a ${D(rr.fim)}`,'hl')}${kpi('Royalties gerados pelas vendas',RK(rr.ear),P(rr.ating)+' do mínimo')}${kpi('Vendas para cobrir o mínimo',RK(rr.vendNec),'vendido até agora '+RK(rr.vend))}${kpi('Falta vender',RK(rr.falta),rr.falta?`≈ ${RK(rr.mesNec)} por mês`:'mínimo coberto')}</div>
  <div class="card"><h2>Como o mínimo garantido funciona aqui</h2><p class="note" style="max-width:75ch">O clube recebe o <b>maior</b> valor entre o mínimo garantido e ${P(rr.pct)} das vendas. As parcelas do mínimo entram no contas a pagar nas datas do contrato e funcionam como adiantamento. Quando os royalties acumulados das vendas passam do mínimo já vencido, a diferença é o <b>royalty excedente</b> do período, que você lança abaixo. Se as vendas do ano não chegarem a ${R(rr.vendNec)}, a parte não coberta do mínimo vira custo sem venda, e aparece no DRE como “mínimo não coberto”.</p>
   <div style="margin-top:10px">${mbar(rr.ear,rr.mg,rr.ating>=100?'ok':'')}</div></div>
  <div class="card"><h2>Apuração por período</h2><div class="tw"><table><thead><tr><th>Período</th><th class="n">Pedidos</th><th class="n">Vendas</th><th class="n">Royalty do período</th><th class="n">Royalty acumulado</th><th class="n">Mínimo vencido acum.</th><th class="n">Excedente a pagar</th><th></th></tr></thead><tbody>
  ${per.map(p=>`<tr><td>${D(p.ini)} a ${D(p.end)} ${!p.fechado?chip('em curso'):''}</td><td class="n">${p.ped}</td><td class="n">${R(p.vend)}</td><td class="n">${R(p.ear)}</td><td class="n">${R(p.cumE)}</td><td class="n">${R(p.cumMG)}</td><td class="n ${p.top?'gold':''}">${R(p.top)}</td>
  <td class="n">${p.lanc?chip('Lançado','c-ok'):p.top>0?`<button class="btn sm ${p.fechado?'pri':''}" data-act="royLanc" data-c="${ct.id}" data-k="${p.ini}" data-e="${p.end}" data-v="${r2(p.top)}">Lançar a pagar</button>`:''}</td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="card"><h2>Parcelas do mínimo garantido</h2><div class="tw"><table><thead><tr><th>Vencimento</th><th class="n">Valor</th><th>Situação</th></tr></thead><tbody>
  ${(ct.mgParcelas||[]).map((x,j)=>{const tt=S.pagar.find(t=>t.origem==='mg'&&t.ref===ct.id&&t.key===j);return `<tr><td>${D(x.venc)}</td><td class="n">${R(x.valor)}</td><td>${tt?.pago?chip('Pago '+D(tt.pagoEm),'c-ok'):x.venc<today()?chip('Vencida','c-bad'):chip('A vencer')}</td></tr>`}).join('')||'<tr><td colspan="3" class="mut">Sem parcelas cadastradas no contrato.</td></tr>'}</tbody></table></div></div>`;
};

VIEWS.dre=()=>{
  const t=today();if(!UI.dre){const l=licAtiva();UI.dre={de:l?mkey(l.inicio):nextMonthKey(mkey(t),-2),ate:mkey(t),rep:'',gest:''}}
  const F=UI.dre;const ini=F.de+'-01',fim=lastDay(F.ate);
  const ps=pedFat().filter(p=>p.faturadoEm>=ini&&p.faturadoEm<=fim&&(!F.rep||p.repId===F.rep)&&(!F.gest||lojaById(p.lojaId)?.g.id===F.gest));
  const d=sumDre(ps);const meses=Math.max(1,monthsSpan(ini,fim));
  const filtrado=F.rep||F.gest;
  let compl=0;const l=licAtiva();
  if(l&&!filtrado){const lf=l.fim||addMonths(l.inicio,12);const a=ini>l.inicio?ini:l.inicio,b=fim<lf?fim:lf;if(a<=b){const mm=monthsSpan(a,b);const mgPr=n(l.mg)/monthsSpan(l.inicio,lf)*mm;const roy=sum(pedFat().filter(p=>p.faturadoEm>=a&&p.faturadoEm<=b),p=>dreCalc(p).roy);compl=Math.max(0,mgPr-roy)}}
  let cats_=fixasPeriodo(ini,fim);if(!cats_.length)cats_=[['Bloco 39 – armazém',n(S.cfg.armazemMensal)*meses],['Despesas fixas',n(S.cfg.despFixasMes)*meses]].filter(x=>x[1]>0).map(([cat,v])=>({cat,v}));
  const mktV=sum((S.mkt||[]).flatMap(a=>a.despesas||[]).filter(x=>x.venc>=ini&&x.venc<=fim),x=>n(x.valor));if(mktV)cats_.push({cat:'Marketing (ações)',v:mktV});
  const ext=filtrado?null:{compl,cats:cats_,fix:sum(cats_,x=>x.v)};if(ext)ext.res=d.mc-ext.compl-ext.fix;
  const porModelo={};ps.forEach(p=>dreCalc(p).itens.forEach(i=>{const o=porModelo[i.pid]||(porModelo[i.pid]={q:0,b:0,mc:0});o.q+=i.qtd;o.b+=i.bruto;o.mc+=i.mc}));
  const grpBy=(key)=>{const o={};ps.forEach(p=>{const k=key(p);const dd=dreCalc(p);const x=o[k]||(o[k]={b:0,mc:0,com:0,n:0});x.b+=dd.bruto;x.mc+=dd.mc;x.com+=dd.com;x.n++});return Object.entries(o).sort((a,b)=>b[1].b-a[1].b)};
  const mopts=[];for(let i=-18;i<=1;i++)mopts.push(nextMonthKey(mkey(t),i));
  return `<div class="head"><div><h1>DRE</h1><p>Resultado das vendas faturadas no período</p></div></div>
  <div class="card"><div class="fg">
   ${fld('dDe','De',0,{sel:mopts.map(k=>opt(k,ML(k),F.de)).join('')})}${fld('dAte','Até',0,{sel:mopts.map(k=>opt(k,ML(k),F.ate)).join('')})}
   ${fld('dRep','Representante',0,{sel:opt('','Todos',F.rep)+S.reps.map(r=>opt(r.id,r.nome,F.rep)).join('')})}${fld('dGest','Gestor',0,{sel:opt('','Todos',F.gest)+S.gestores.map(g=>opt(g.id,g.nome,F.gest)).join('')})}
  </div></div>
  <div class="split"><div class="card"><h2>Demonstrativo <span class="sm mut">${d.n} pedidos · ${N(d.pecas)} peças · ${meses} ${meses>1?'meses':'mês'}</span></h2><div class="tw">${dreRows(d,ext)}</div>${filtrado?'<p class="note">Com filtro de representante ou gestor o DRE para na margem de contribuição; custos fixos e mínimo garantido entram só no total.</p>':''}</div>
  <div class="card"><h2>Por modelo</h2><div class="tw"><table><thead><tr><th>Modelo</th><th class="n">Pç</th><th class="n">Receita</th><th class="n">MC</th></tr></thead><tbody>
  ${Object.entries(porModelo).sort((a,b)=>b[1].b-a[1].b).map(([pid,o])=>`<tr><td>${h(prod(pid)?.nome||'—')}</td><td class="n">${N(o.q)}</td><td class="n">${R(o.b)}</td><td class="n ${o.mc<0?'bad':''}">${P(o.b?o.mc/o.b*100:0)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">Sem vendas.</td></tr>'}</tbody></table></div></div></div>
  <div class="card"><h2>Por canal de venda</h2><div class="tw"><table><thead><tr><th>Canal</th><th class="n">Pedidos</th><th class="n">Receita</th><th class="n">Comissão / plataforma</th><th class="n">MC</th><th class="n">MC %</th></tr></thead><tbody>
  ${Object.keys(CANAIS).map(k=>{const ps_=ps.filter(p=>dreCalc(p).canal===k);const x=sumDre(ps_);return `<tr><td>${CANAIS[k]}</td><td class="n">${ps_.length}</td><td class="n">${R(x.bruto)}</td><td class="n">${R(x.com+x.plat)}</td><td class="n">${R(x.mc)}</td><td class="n">${ps_.length?P(x.mcp):'—'}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="cols"><div class="card"><h2>Por representante (PL)</h2><div class="tw"><table><thead><tr><th>Representante</th><th class="n">Pedidos</th><th class="n">Receita</th><th class="n">Comissão</th><th class="n">MC</th></tr></thead><tbody>
  ${grpBy(p=>p.repId||'').map(([k,o])=>`<tr><td>${h(rep(k)?.nome||'Sem representante')}</td><td class="n">${o.n}</td><td class="n">${R(o.b)}</td><td class="n">${R(o.com)}</td><td class="n">${P(o.b?o.mc/o.b*100:0)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">—</td></tr>'}</tbody></table></div></div>
  <div class="card"><h2>Por gestor</h2><div class="tw"><table><thead><tr><th>Gestor</th><th class="n">Pedidos</th><th class="n">Receita</th><th class="n">MC</th></tr></thead><tbody>
  ${grpBy(p=>lojaById(p.lojaId)?.g.id||'').map(([k,o])=>`<tr><td>${h(gest(k)?.nome||'—')}</td><td class="n">${o.n}</td><td class="n">${R(o.b)}</td><td class="n">${P(o.b?o.mc/o.b*100:0)}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">—</td></tr>'}</tbody></table></div></div></div>`;
};

   ${c.tipo==='licenca'?`<span>Royalty</span><span>${P(n(c.pct))}</span><span>Mínimo garantido</span><span class="gold">${R(c.mg)}</span><span>Parcelas do mínimo</span><span>${(c.mgParcelas||[]).length}</span>`:''}${n(c.valor)?`<span>Valor</span><span>${R(c.valor)}</span>`:''}
   <span>Documento</span><span>${c.anexo?'📎 '+h(c.anexo.nome):c.link?'link':'—'}</span></div>${c.obs?`<p class="note">${h(c.obs).slice(0,180)}</p>`:''}</div>`}).join('')}</div>`:`<div class="empty">Comece pelo contrato de licença do Flamengo: percentual, mínimo garantido e parcelas.</div>`}`;

VIEWS.reps=()=>{
  const t=today(),mes=mkey(t);const fat=pedFat();const ant=nextMonthKey(mes,-1);const mesOpts=[ant,mes];
  const grupos={};S.reps.forEach(r=>{const k=r.empresa||r.nome;(grupos[k]=grupos[k]||[]).push(r)});
  const v=(ids,k)=>{const ps=fat.filter(p=>ids.includes(p.repId)&&mkey(p.faturadoEm)===k);return {b:sum(ps,p=>dreCalc(p).bruto),c:sum(ps,p=>dreCalc(p).com),n:ps.length}};
  return `<div class="head"><div><h1>Representantes</h1><p>Canal de venda por representação. A comissão é paga à empresa de representação, com o detalhe de cada representante.</p></div><div class="acts"><button class="btn pri" data-act="editRep">+ Representante</button></div></div>
  ${S.reps.length?Object.entries(grupos).map(([g,rs])=>{const ids=rs.map(r=>r.id);const emp=rs.some(r=>r.empresa);
   return `<div class="card"><h2>${h(g)} <span class="sm mut">${emp?rs.length+' representante(s)':'autônomo'}</span></h2><div class="tw"><table><thead><tr><th>Representante</th><th>Região</th><th class="n">Comissão</th><th class="n">Gestores</th>${mesOpts.map(k=>`<th class="n">Vendas ${ML(k)}</th><th class="n">Comissão ${ML(k)}</th>`).join('')}</tr></thead><tbody>
   ${rs.map(r=>`<tr class="click" data-act="editRep" data-id="${r.id}"><td><b>${h(r.nome)}</b><div class="sm mut">${h(r.telefone||'')}</div></td><td>${h(r.regiao||'')}</td><td class="n">${P(n(r.comissao))}</td><td class="n">${S.gestores.filter(x=>x.repId===r.id).length}</td>${mesOpts.map(k=>{const x=v([r.id],k);return `<td class="n">${R(x.b)}</td><td class="n">${R(x.c)}</td>`}).join('')}</tr>`).join('')}
   </tbody><tfoot><tr><td colspan="4">Total ${h(g)}</td>${mesOpts.map(k=>{const x=v(ids,k);return `<td class="n">${R(x.b)}</td><td class="n">${R(x.c)}</td>`}).join('')}</tr></tfoot></table></div>
   <div class="acts" style="margin-top:10px;justify-content:flex-end">${mesOpts.map(k=>{const x=v(ids,k);const l=S.pagar.find(p=>p.origem==='comissao'&&p.ref==='grp:'+g&&p.key===k);return x.c>0?(l?chip(`Comissão ${ML(k)} lançada`,'c-ok'):`<button class="btn sm ${k===ant?'pri':''}" data-act="comLanc" data-g="${h(g)}" data-k="${k}">Lançar comissão ${ML(k)} · ${R(x.c)}</button>`):''}).join('')}</div></div>`}).join('')
   +`<p class="note">Comissão calculada sobre o valor faturado no mês, só nos pedidos do canal Representante. Vendas diretas e do site B2B não geram comissão. “Lançar” cria um título em Contas a pagar para a empresa de representação.</p>`:`<div class="empty">Cadastre os representantes comerciais.</div>`}`;
};
ACT.comLanc=d=>{const g=d.g,k=d.k;const rs=S.reps.filter(r=>(r.empresa||r.nome)===g);const fat=pedFat().filter(p=>mkey(p.faturadoEm)===k);
  const det=rs.map(r=>{const c=sum(fat.filter(p=>p.repId===r.id),p=>dreCalc(p).com);return {r,c}}).filter(x=>x.c>0);const tot=r2(sum(det,x=>x.c));if(!tot)return;
  S.pagar.push({id:uid(),origem:'comissao',ref:'grp:'+g,key:k,desc:`Comissão ${ML(k)} – ${g}`,fav:g,cat:'Comissões',venc:addDays(lastDay(k),10),valor:tot,pago:false,pagoEm:'',obs:det.map(x=>`${x.r.nome}: ${R(x.c)}`).join(' · ')});
  save();render();toast(`Comissão de ${R(tot)} lançada para ${g}`,'okk')};

/* ============ sell-out (PDV) ============ */
function calcSellout(){
  const t=today(),c=S.cfg,M={};
  const L=id=>M[id]||(M[id]={itens:{},last:'',first:'',in:0,out:0,out30:0,v30:0});
  const I=(l,pid)=>l.itens[pid]||(l.itens[pid]={in:0,out:0,out30:0,v30:0});
  S.pedidos.filter(p=>p.baixado).forEach(p=>{const l=L(p.lojaId);p.itens.forEach(i=>{const q=n(i.qtd);I(l,i.pid).in+=q;l.in+=q})});
  allSellout().forEach(s=>{const l=L(s.lojaId);const o=I(l,s.pid);o.out+=n(s.qtd);l.out+=n(s.qtd);
    if(!l.last||s.data>l.last)l.last=s.data;if(!l.first||s.data<l.first)l.first=s.data;
    if(diffDays(s.data,t)<30){o.out30+=n(s.qtd);o.v30+=n(s.valor);l.out30+=n(s.qtd);l.v30+=n(s.valor)}});
  Object.values(M).forEach(l=>{const div=l.first?Math.min(30,Math.max(7,diffDays(l.first,t)+1)):30;l.sugQ=0;l.sugV=0;l.cobMin=Infinity;
    Object.entries(l.itens).forEach(([pid,o])=>{o.est=Math.max(0,o.in-o.out);o.vDia=o.out30/div;o.cob=o.vDia>0?o.est/o.vDia:Infinity;
      const need=o.vDia*(n(c.coberturaLoja)+n(c.entregaLoja))-o.est;o.sug=o.vDia>0&&need>0?arred(need,prod(pid)):0;
      l.sugQ+=o.sug;l.sugV+=o.sug*n(prod(pid)?.precoLojista);if(o.vDia>0)l.cobMin=Math.min(l.cobMin,o.cob)})});
  return M;
}
function sugerirRepos(){const l=calcSellout()[PD.lojaId];const its=l?Object.entries(l.itens).filter(([,o])=>o.sug>0):[];
  if(!its.length){toast('Sem sugestão: a loja ainda não tem vendas do PDV suficientes.');return false}
  PD.itens=its.map(([pid,o])=>({pid,qtd:o.sug,preco:n(prod(pid)?.precoLojista)}));toast('Itens sugeridos pelo sell-out da loja');return true}

  const tot={out30:sum(rows,r=>r.s.out30),v30:sum(rows,r=>r.s.v30),in:sum(rows,r=>r.s.in),out:sum(rows,r=>r.s.out)};
  const rep_=rows.filter(r=>r.s.last);const ult=rep_.map(r=>r.s.last).sort().pop();
  const pm={};rows.forEach(r=>Object.entries(r.s.itens).forEach(([pid,o])=>{const x=pm[pid]||(pm[pid]={out30:0,est:0,sug:0});x.out30+=o.out30;x.est+=o.est;x.sug+=o.sug}));const pmx=Math.max(1,...Object.values(pm).map(x=>x.out30));

  <div class="card"><h2>Lojas</h2><div class="tw"><table><thead><tr><th>Loja</th><th>Última venda</th><th class="n">Comprou</th><th class="n">Vendeu</th><th class="n">Vendeu 30 d</th><th class="n">Estoque na loja</th><th class="n">Menor cobertura</th><th class="n">Repor</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${h(r.l.nome)}</b><div class="sm mut">${h(r.g.nome)}</div></td><td>${r.s.last?D(r.s.last)+(diffDays(r.s.last,t)>3?' '+chip('parado','c-warn'):''):'<span class="mut">sem PDV</span>'}</td><td class="n">${N(r.s.in)}</td><td class="n">${N(r.s.out)}</td><td class="n">${N(r.s.out30)}</td><td class="n">${N(Math.max(0,r.s.in-r.s.out))}</td><td class="n ${r.s.cobMin<n(S.cfg.entregaLoja)+7?'bad':''}">${isFinite(r.s.cobMin)?N(r.s.cobMin)+' d':'—'}</td><td class="n">${r.s.sugQ?`<b class="gold">${N(r.s.sugQ)} pç</b><div class="sm mut">${R(r.s.sugV)}</div>`:'—'}</td><td class="n">${r.s.sugQ?`<button class="btn sm pri" data-act="pedSug" data-l="${r.l.id}">Gerar pedido</button>`:''}</td></tr>`).join('')||'<tr><td colspan="9" class="mut">Nenhuma loja com compras ou vendas ainda.</td></tr>'}
  </tbody></table></div><p class="note">Estoque na loja = peças faturadas para ela − peças que ela vendeu (estimado). Reposição = giro dos últimos 30 dias × (${n(S.cfg.coberturaLoja)} dias de cobertura + ${n(S.cfg.entregaLoja)} de entrega) − estoque na loja, no múltiplo de venda.</p></div>
  <div class="card"><h2>Giro por modelo nas lojas <span class="sm mut">30 dias</span></h2>${Object.keys(pm).length?Object.entries(pm).sort((a,b)=>b[1].out30-a[1].out30).map(([pid,x])=>`<div class="hb"><span>${h(prod(pid)?.nome||'—')}</span>${mbar(x.out30,pmx)}<span class="num">${N(x.out30)} pç · est. ${N(x.est)}</span></div>`).join(''):'<div class="note">Sem dados.</div>'}</div>
  <div class="card"><h2>Integração com o PDV das lojas</h2><div class="note" style="max-width:80ch">
   <p style="margin-top:0">${SB?`<b class="ok">Endereço ativo.</b> Vendas recebidas do PDV nos últimos 120 dias: <b>${N(PDV.length)}</b> registro(s)${pdvMapeado.semLoja?`, <span class="warn">${N(pdvMapeado.semLoja)} sem loja ou pelúcia correspondente (confira CNPJ/código e EAN)</span>`:''}. O PDV envia com o cabeçalho <b>x-api-key</b> (segredo PDV_API_KEY do projeto), neste formato:`:'Hoje as vendas entram por arquivo exportado do PDV (botão acima). Para chegar em tempo real, o PDV de cada loja (ou a central da rede) envia as vendas para um endereço do sistema, neste formato:'}</p>
   <pre style="background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;color:var(--fg);font-size:12.5px">POST ${SB?h(window.SUPA_CFG.url)+'/functions/v1/pdv-vendas':'/api/pdv/vendas'}
{
  "cnpj": "12345678000190",      // ou "loja": código da loja no PDV
  "data": "2026-10-29",
  "itens": [
    { "ean": "7890000000017", "qtd": 3, "valor": 239.70 },
    { "ean": "7890000000024", "qtd": 1, "valor": 139.90 }
  ]
}</pre>
   <p>Cada envio é o total do dia por produto; reenviar o mesmo dia substitui o anterior. A loja é reconhecida pelo CNPJ (ou código no PDV) e a pelúcia pelo EAN, por isso os dois cadastros precisam estar completos. Esse mesmo JSON pode ser colado na importação para testar.</p>

  onInput:()=>{const r=parseSell(fv('slTxt'));$('#slPrev').innerHTML=r.total?`${r.ok.length} linha(s) reconhecida(s)${r.erros.length?` · <span class="bad">${r.erros.length} não reconhecida(s): ${h(r.erros.slice(0,3).join(' | '))}${r.erros.length>3?'…':''}</span>`:''}`:''},

function achaLoja(x){const dg=onlyDig(x),s=String(x).trim();return allLojas().find(o=>o.l.pdvCod&&o.l.pdvCod===s)||allLojas().find(o=>dg.length===14&&onlyDig(o.l.cnpj)===dg)}
function achaProd(x){const s=String(x).trim();const dg=onlyDig(s);return S.produtos.find(p=>(dg&&p.ean===dg)||p.cod===s.toUpperCase())}
function normData(s){s=String(s).trim();const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m)return (m[3].length===2?'20'+m[3]:m[3])+'-'+pad(m[2])+'-'+pad(m[1]);return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:''}
function parseSell(txt){const ok=[],erros=[];txt=String(txt).trim();if(!txt)return {ok,erros,total:0};
  let linhas=[];
  if(txt[0]==='{'||txt[0]==='['){try{const j=JSON.parse(txt);(Array.isArray(j)?j:[j]).forEach(e=>(e.itens||[]).forEach(i=>linhas.push([e.data,e.cnpj||e.loja,i.ean||i.codigo,i.qtd,i.valor])))}catch(e){erros.push('JSON inválido');return {ok,erros,total:1}}}
  else linhas=txt.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split(l.includes('\t')?'\t':';').map(x=>x.trim()));
  linhas.forEach(c=>{if(/^data$/i.test(c[0]))return;const dt=normData(c[0]),L=achaLoja(c[1]||''),p=achaProd(c[2]||'');
    if(!dt||!L||!p||!n(c[3])){erros.push(`${c[1]||'?'} / ${c[2]||'?'}${!L?' (loja)':!p?' (pelúcia)':!dt?' (data)':' (qtd)'}`);return}
    ok.push({data:dt,lojaId:L.l.id,pid:p.id,qtd:n(c[3]),valor:n(c[4])})});
  return {ok,erros,total:linhas.length}}
ACT.slOk=()=>{const r=parseSell(fv('slTxt'));if(!r.ok.length)return toast('Nenhuma linha reconhecida. Confira CNPJ/código da loja e EAN das pelúcias.','err');
  r.ok.forEach(x=>{S.sellout=S.sellout.filter(s=>!(s.data===x.data&&s.lojaId===x.lojaId&&s.pid===x.pid));S.sellout.push({id:uid(),origem:'importacao',...x})});
  save();closeModal();render();toast(`${r.ok.length} venda(s) importada(s)${r.erros.length?`, ${r.erros.length} ignorada(s)`:''}`,'okk')};

let PD=null;
ACT.novoPedido=d=>{const L=d&&d.l?lojaById(d.l):null;
  PD={id:null,data:today(),lojaId:L?L.l.id:'',gestorId:L?L.g.id:'',repId:L?L.g.repId||'':'',itens:[],desc:0,frete:0,transp:'',formaPag:'boleto',cot:[],cotSel:0,prazo:S.cfg.prazoPadrao,status:'orcamento',nf:'',obs:'',faturadoEm:''};
  const prev=L&&S.pedidos.some(p=>p.lojaId===L.l.id&&p.status!=='cancelado');PD.canal=prev&&PD.repId?'representante':'direta';if(PD.canal!=='representante')PD.repId='';
  if(d&&d.rep){if(d.sug)sugerirRepos();else repetirUltimo()}abrirPD()};
ACT.abrirPedido=d=>{const p=S.pedidos.find(x=>x.id===d.id);PD=JSON.parse(JSON.stringify(p));PD.gestorId=lojaById(p.lojaId)?.g.id||'';abrirPD()};
function repetirUltimo(){const ps=S.pedidos.filter(p=>p.lojaId===PD.lojaId&&p.id!==PD.id&&p.status!=='cancelado').sort((a,b)=>b.data.localeCompare(a.data));if(!ps[0]){toast('Esta loja ainda não tem pedido anterior.');return false}
  PD.itens=ps[0].itens.map(i=>({pid:i.pid,qtd:i.qtd,preco:prod(i.pid)?.precoLojista??i.preco}));PD.prazo=ps[0].prazo;toast('Itens do pedido '+ps[0].num+' copiados');return true}
function lerPD(){if(!$('#pd_data'))return;
  if($('#pd_parc')&&!$('#pd_parc').disabled)PD.parcCartao=n(fv('pd_parc'));
  ['data','prazo','nf','obs','status','faturadoEm','repId','formaPag','link','canal'].forEach(k=>{const el=document.getElementById('pd_'+k);if(el&&!el.disabled)PD[k]=el.value});
  if(!PD.baixado&&(PD.canal||'direta')!=='representante')PD.repId='';
  PD.lojaId=fv('pd_loja')||PD.lojaId;PD.gestorId=fv('pd_gest')||PD.gestorId;
  if(!PD.baixado){PD.desc=n(fv('pd_desc'));
    PD.cot=[...document.querySelectorAll('#pdCot tr')].map(tr=>({tid:tr.querySelector('.ct').value,valor:n(tr.querySelector('.cv').value),prazo:n(tr.querySelector('.cp').value)}));
    const sel=document.querySelector('input[name=cotSel]:checked');PD.cotSel=sel?+sel.value:0;
    const ch=PD.cot[PD.cotSel];PD.frete=ch?ch.valor:0;PD.transp=ch?S.transportadoras.find(t=>t.id===ch.tid)?.nome||'':'';PD.transpId=ch?ch.tid:''}
  if(!PD.baixado){const its=[];document.querySelectorAll('#pdItens tr[data-pid]').forEach(tr=>{const q=n(tr.querySelector('.q').value);if(q>0)its.push({pid:tr.dataset.pid,qtd:q,preco:n(tr.querySelector('.pr').value)})});PD.itens=its}}
function abrirPD(){openModal(PD.id?`Pedido ${PD.num}`:'Novo pedido',{wide:true,body:bodyPD,foot:footPD,
  onInput:e=>{if(e.target.closest('#pdItens')||e.target.closest('#pdCot')||['pd_desc','pd_prazo'].includes(e.target.id)){lerPD();atualizaPD()}},
  onChange:e=>{const id=e.target.id;lerPD();if(id==='pd_gest'){PD.lojaId='';PD.repId=PD.canal==='representante'?gest(PD.gestorId)?.repId||'':'';drawModal()}
    else if(id==='pd_formaPag'){PD.prazo=prazoForma(PD.formaPag);drawModal()}
    else if(id==='pd_canal'){if(PD.canal==='representante'&&!PD.repId)PD.repId=gest(PD.gestorId)?.repId||'';drawModal()}
    else if(id==='pd_loja'||id==='pd_status'||id==='pd_repId'){drawModal()}else atualizaPD()},after:atualizaPD})}

ACT.copiaMsg=()=>{lerPD();const d=dreCalc(PD);const bol=dreCalc({...PD,formaPag:'boleto',prazo:S.cfg.prazoPadrao});const L=lojaById(PD.lojaId);
  const txt=`Olá${L?', '+L.g.nome:''}! Segue o link para pagamento do pedido de pelúcias oficiais do Flamengo${L?' – '+L.l.nome:''}:\n${PD.link||'[link de pagamento]'}\n\nValor no cartão: ${R(d.bruto)} (${P(n(S.cfg.descCartao))} de desconto; no boleto seria ${R(bol.bruto)}).\nParcelamento:\n`+parcOpcoes(d.bruto).map(o=>`• ${o.N}x de ${R(o.parc)}${o.jur?` (total ${R(o.tot)})`:' sem juros'}`).join('\n')+`\n\nQualquer dúvida, estou à disposição.`;

function atualizaPD(){const d=dreCalc(PD);

  $('#pdDre').innerHTML=(d.pecas?`<div style="margin-bottom:10px">${cmp}</div>`:'')+dreRows(d);
  const box=$('#pdCartao');if(box){const dc=dreCalc({...PD,formaPag:'cartao',parcCartao:1});const bol=dreCalc({...PD,formaPag:'boleto',prazo:S.cfg.prazoPadrao});
    if(!d.pecas||d.fp==='pix'){box.innerHTML='';box.className=''}

      box.className='box';box.innerHTML=`<div class="row"><h3 style="margin:0">Condições no cartão (o lojista escolhe no link)</h3><label class="sm">Parcelas escolhidas <select id="pd_parc" style="width:auto" ${PD.baixado?'disabled':''}>${ops.map(o=>opt(o.N,o.N+'x',sel)).join('')}</select></label></div>
      <div class="tw" style="margin-top:8px"><table><thead><tr><th>Parcelas</th><th class="n">Valor da parcela</th><th class="n">Total pago</th><th>Condição</th></tr></thead><tbody>${ops.map(o=>`<tr ${o.N===sel?'style="background:var(--goldbg)"':''}><td>${o.N}x</td><td class="n">${R(o.parc)}</td><td class="n">${R(o.tot)}</td><td class="sm">${o.jur?`com juros de ${P(o.jur)} (cartão ${P(taxaCartao(o.N))} + ${P(n(S.cfg.spreadCartao))})`:'<span class="ok">sem juros</span>'}</td></tr>`).join('')}</tbody></table></div>
      <p class="note">${ops.length<10?`Com este valor: ${ops.length===1?`2x a partir de ${R(S.cfg.cartaoMin2)}`:`3x a 10x a partir de ${R(S.cfg.cartaoMin3)}`}. `:''}Recebimento: 1 parcela a cada 30 dias, já descontado o MDR.</p>
      <div class="banner" style="background:var(--okbg);border-color:rgba(98,194,148,.35)"><span><b>Vantagens para o lojista:</b> ${P(n(S.cfg.descCartao))} de desconto, paga ${R(d.bruto)} em vez de ${R(bol.bruto)} no boleto (economia de ${R(bol.bruto-d.bruto)}); até 3x sem juros acima de ${R(S.cfg.cartaoMin3)}; até 10x preservando o caixa da loja.</span><button class="btn sm" data-act="copiaMsg">Copiar mensagem com o link</button></div><textarea id="msgOut" hidden readonly></textarea>`}
    else{box.className='box';box.innerHTML=`<div class="row"><span class="sm"><b class="gold">No cartão</b> este pedido sai por <b>${R(dc.bruto)}</b> para o lojista (economia de ${R(bol.bruto-dc.bruto)} sobre o boleto) e pode ser parcelado em até ${maxParc(dc.bruto)}x.</span>${PD.baixado?'':'<button class="btn sm" data-act="pdCartao">Mudar para cartão</button>'}</div>`}}
  document.querySelectorAll('#pdItens tr[data-pid]').forEach(tr=>{const q=n(tr.querySelector('.q').value),pr=n(tr.querySelector('.pr').value);tr.querySelector('.st').textContent=q?R(q*pr):''});
  $('#pdTot').textContent=`${N(d.pecas)} peças · ${R(d.bruto)}`}

   ${fld('pd_desc','Desconto comercial extra (%)',p.desc,{t:'number',dis:lk})}

ACT.pdMix=()=>{lerPD();const m=S.mixes.find(x=>x.id===fv('pd_mix'));if(!m)return;const L=lojaById(PD.lojaId);const mult=n(S.cfg['mult'+(L?.l.pot||'B')])||1;
  PD.itens=m.itens.filter(i=>n(i.qtd)>0).map(i=>{const p=prod(i.pid);return {pid:i.pid,qtd:arred(n(i.qtd)*mult,p),preco:n(p?.precoLojista)}}).filter(i=>prod(i.pid));drawModal();toast(`Mix “${m.nome}” aplicado (${mult}×)`)};

ACT.pdSalvar=()=>{lerPD();const p=PD;
  if(!p.lojaId)return toast('Escolha o gestor e a loja.','err');
  if(!p.itens.length)return toast('Inclua ao menos um item.','err');
  if(p.canal==='representante'&&!p.repId)return toast('Escolha o representante.','err');
  const orig=p.id?S.pedidos.find(x=>x.id===p.id):null;
  let err=null;
  if(FAT.includes(p.status)&&!p.baixado)err=baixar(p);
  else if(['orcamento','confirmado','cancelado'].includes(p.status)&&p.baixado){err=estornar(p)}
  if(err){if(p.baixado===false&&orig&&orig.baixado)p.status=orig.status;return toast(err,'err')}
  if(p.status==='pago'&&p.parcelas){p.parcelas.forEach(x=>{if(!x.pago){x.pago=true;x.pagoEm=today()}});p.pagoEm=p.pagoEm||today()}
  if(!p.id){p.id=uid();S.seq.ped++;p.num=S.seq.ped;S.pedidos.push(p)}else{S.pedidos[S.pedidos.findIndex(x=>x.id===p.id)]=p}
  delete p.gestorId;save();closeModal();render();toast(`Pedido ${p.num} salvo`,'okk')};

function carregaSheetJS(){return window.XLSX?Promise.resolve():new Promise((ok,er)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';sc.onload=ok;sc.onerror=er;document.head.appendChild(sc)})}
async function lerExcel(inp){const f=inp.files[0];if(!f)return;$('#impArqNome').textContent='Lendo '+f.name+'…';
  try{await carregaSheetJS();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const nome=wb.SheetNames.find(x=>/loja/i.test(x)&&!/click/i.test(x))||wb.SheetNames[0];
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[nome],{header:1,raw:false,defval:'',blankrows:false});
    const tsv=rows.map(r=>r.map(c=>String(c??'').replace(/[\t\r\n]+/g,' ').trim()).join('\t')).filter(l=>l.replace(/\t/g,'').trim()).join('\n');
    $('#impTxt').value=tsv;$('#impArqNome').textContent=`${f.name} · aba ${nome}`;prevImp()}
  catch(e){$('#impArqNome').textContent='Não consegui ler o arquivo. Copie as linhas no Excel e cole abaixo.';toast('Não consegui ler o Excel. Use copiar e colar.','err')}}
function parseImp(txt,apply){
  const linhas=String(txt).split(/\r?\n/).filter(l=>l.trim());let gNovos=0,lNovas=0,atu=0,cnpjInv=0;const gMap={};S.gestores.forEach(g=>gMap[g.nome.trim().toLowerCase()]=g);
  if(!linhas.length)return {linhas:0,gNovos,lNovas,atu,cnpjInv};
  const sep=linhas[0].includes('\t')?'\t':';';const norm=s=>String(s||'').trim().toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'_');
  const h0=linhas[0].split(sep).map(norm);const temTit=h0.includes('GESTOR')&&h0.includes('LOJA');
  const idx=temTit?Object.fromEntries(h0.map((k,i)=>[k,i])):{GESTOR:0,LOJA:1,CNPJ:2,CIDADE:3,ESTADO:4,POTENCIAL:5};
  const col=(c,k)=>idx[k]!=null?String(c[idx[k]]??'').trim():'';
  (temTit?linhas.slice(1):linhas).forEach(li=>{const c=li.split(sep);const gn=col(c,'GESTOR');if(!gn||/^gestor$/i.test(gn))return;
    let g=gMap[gn.toLowerCase()];
    if(!g){g={id:uid(),nome:gn,grupo:'',telefone:'',email:'',cidade:col(c,'CIDADE'),uf:(col(c,'ESTADO')||col(c,'UF')).toUpperCase(),repId:'',qtdLojas:0,status:'ativo',obs:'',lojas:[]};gMap[gn.toLowerCase()]=g;gNovos++;if(apply)S.gestores.push(g)}
    const ln=col(c,'LOJA');if(!ln)return;const dg=onlyDig(col(c,'CNPJ'));if(dg&&!cnpjOk(dg))cnpjInv++;
    const end=[col(c,'ENDERECO'),col(c,'NUMERO'),col(c,'COMPLEMENTO')].filter(Boolean).join(', ');
    const dados={nome:ln,cnpj:dg,cidade:col(c,'CIDADE'),uf:(col(c,'ESTADO')||col(c,'UF')).toUpperCase()};
    if(temTit)Object.assign(dados,{razao:col(c,'RAZAO_SOCIAL'),ie:col(c,'INSCRICAO_ESTADUAL'),suframa:col(c,'SUFRAMA'),endereco:end,bairro:col(c,'BAIRRO'),cep:(d=>d.length===7?'0'+d:col(c,'CEP'))(onlyDig(col(c,'CEP'))),
      status:/inativ/i.test(col(c,'STATUS_LOJA'))?'inativa':'ativa',rede:col(c,'REDE'),
      comprador:{nome:col(c,'COMPRADOR'),tel:col(c,'TEL_COMPRADOR'),email:col(c,'EMAIL_COMPRADOR')},financeiro:{nome:col(c,'FINANCEIRO'),tel:col(c,'TEL_FINANCEIRO'),email:col(c,'EMAIL_FINANCEIRO')}});
    const pot=col(c,'POTENCIAL').toUpperCase();if(/^[ABC]$/.test(pot))dados.pot=pot;
    const ex=allLojas().find(o=>o.l.nome.trim().toLowerCase()===ln.toLowerCase()&&onlyDig(o.l.cnpj)===dg)||(g.lojas||[]).find(l=>l.nome.trim().toLowerCase()===ln.toLowerCase()&&onlyDig(l.cnpj)===dg);
    if(ex){atu++;if(apply)Object.assign(ex.l||ex,dados);return}
    lNovas++;if(apply)g.lojas.push({id:uid(),pot:'B',obs:'',ie:'',razao:'',endereco:'',...dados})});
  return {linhas:linhas.length,gNovos,lNovas,atu,cnpjInv}}
ACT.impOk=()=>{const r=parseImp(fv('impTxt'),true);if(!r.linhas)return toast('Cole as linhas primeiro.','err');S.gestores.forEach(g=>{g.qtdLojas=Math.max(n(g.qtdLojas),(g.lojas||[]).length)});if(allLojas().length>n(S.cfg.totalRede))S.cfg.totalRede=allLojas().length;save();closeModal();render();toast(`${r.gNovos} gestores novos, ${r.lNovas} lojas novas, ${r.atu} atualizadas`,'okk')};

ACT.pcSalvar=()=>{lerPC();const c=PC;if(!c.fornecedorId)return toast('Escolha o fornecedor.','err');if(!c.itens.length)return toast('Inclua ao menos um modelo.','err');
  if(!c.id){c.id=uid();S.seq.comp++;c.num=S.seq.comp;S.compras.push(c)}else S.compras[S.compras.findIndex(x=>x.id===c.id)]=c;
  syncPagarCompra(c);save();closeModal();render();toast(['cotacao','cancelado'].includes(c.status)?'Compra salva':'Compra salva e parcelas lançadas em Contas a pagar','okk')};
ACT.pcReceber=(d,b)=>{lerPC();if(!PC.itens.length)return toast('Sem itens.','err');if(!armed(b,'Confirmar recebimento'))return;const c=PC;const dt=fv('pc_receb')||today();
  if(c.status==='cotacao')c.status='pedido';const L=landed(c);c.itens.forEach(i=>mov(i.pid,'entrada',n(i.qtd),L.map[i.pid],dt,'Compra '+c.num));c.status='recebido';c.recebidoEm=dt;
  S.compras[S.compras.findIndex(x=>x.id===c.id)]=c;syncPagarCompra(c);save();closeModal();render();toast(`${N(L.pecas)} peças recebidas no Bloco 39`,'okk')};
ACT.pcDel=(d,b)=>{if(S.pagar.some(t=>t.origem==='compra'&&t.ref===PC.id&&t.pago))return toast('Há parcelas pagas desta compra. Cancele em vez de excluir.','err');if(!armed(b))return;S.pagar=S.pagar.filter(t=>!(t.origem==='compra'&&t.ref===PC.id));S.compras=S.compras.filter(c=>c.id!==PC.id);save();closeModal();render()};
ACT.compraSug=()=>{const ps=S.produtos.filter(p=>E[p.id].sug>0);const fs=[...new Set(ps.map(p=>p.fornecedorId||''))];

function rkPeriodo(per){const t=today(),m=mkey(t);
  if(per==='mes')return {ini:m+'-01',fim:t,pIni:nextMonthKey(m,-1)+'-01',pFim:addDays(m+'-01',-1),l:'Mês atual (até hoje)'};
  if(per==='mesant'){const k=nextMonthKey(m,-1);return {ini:k+'-01',fim:lastDay(k),pIni:nextMonthKey(m,-2)+'-01',pFim:lastDay(nextMonthKey(m,-2)),l:'Mês anterior'}}
  if(per==='90')return {ini:addDays(t,-89),fim:t,pIni:addDays(t,-179),pFim:addDays(t,-90),l:'Últimos 90 dias'};
  if(per==='ano'){const y=t.slice(0,4);return {ini:y+'-01-01',fim:t,pIni:(y-1)+'-01-01',pFim:addDays(t,-365),l:'Ano até hoje'}}
  return {ini:'0000-01-01',fim:'9999-12-31',l:'Todo o período'}}
VIEWS.ranking=()=>{
  const F=UI.rk;const pr=rkPeriodo(F.per);const lojasAll=allLojas().filter(o=>(!F.uf||(o.l.uf||'').toUpperCase()===F.uf));
  const okP=p=>(!F.canal||dreCalc(p).canal===F.canal);
  const fat=pedFat().filter(okP);const SO=allSellout();
  const agg=(ini,fim)=>{const m={};fat.filter(p=>p.faturadoEm>=ini&&p.faturadoEm<=fim).forEach(p=>{const d=dreCalc(p);const x=m[p.lojaId]||(m[p.lojaId]={rec:0,pc:0,ped:0,mc:0,ult:''});x.rec+=d.bruto;x.pc+=d.pecas;x.ped++;x.mc+=d.mc;if(p.faturadoEm>x.ult)x.ult=p.faturadoEm});
    SO.filter(s=>s.data>=ini&&s.data<=fim).forEach(s=>{const x=m[s.lojaId]||(m[s.lojaId]={rec:0,pc:0,ped:0,mc:0,ult:''});x.so=(x.so||0)+n(s.qtd)});return m};
  const A=agg(pr.ini,pr.fim),B=pr.pIni?agg(pr.pIni,pr.pFim):{};
  const met={receita:x=>x.rec,pecas:x=>x.pc,margem:x=>x.mc,sellout:x=>x.so||0}[F.met];
  const metL={receita:'Receita',pecas:'Peças',margem:'Margem de contribuição',sellout:'Sell-out (peças no PDV)'}[F.met];
  const z={rec:0,pc:0,ped:0,mc:0,so:0,ult:''};
  let linhas;
  if(F.tab==='loja')linhas=lojasAll.map(o=>({id:o.l.id,nome:o.l.nome,sub:o.g.nome,uf:o.l.uf,nl:1,a:A[o.l.id]||z,b:B[o.l.id]||z}));
  else{const gm={};lojasAll.forEach(o=>{const g=gm[o.g.id]||(gm[o.g.id]={id:o.g.id,nome:o.g.nome,ufs:new Set(),nl:0,comp:0,a:{...z},b:{...z}});g.nl++;if(o.l.uf)g.ufs.add(o.l.uf);
      const a=A[o.l.id],b=B[o.l.id];if(a&&a.ped)g.comp++;[['a',a],['b',b]].forEach(([k,v])=>{if(!v)return;const t=g[k];t.rec+=v.rec;t.pc+=v.pc;t.ped+=v.ped;t.mc+=v.mc;t.so+=(v.so||0);if(v.ult>t.ult)t.ult=v.ult})});
    linhas=Object.values(gm).map(g=>({...g,uf:[...g.ufs].join(', '),sub:`${g.comp} de ${g.nl} loja(s) compraram`}))}
  const ativos=linhas.filter(x=>met(x.a)>0).sort((a,b)=>met(b.a)-met(a.a));const sem=linhas.filter(x=>!(met(x.a)>0));
  const tot=sum(ativos,x=>met(x.a));const mx=Math.max(1,...ativos.map(x=>met(x.a)));
  const fmt=v=>F.met==='receita'||F.met==='margem'?R(v):N(v);
  const varr=x=>{if(!pr.pIni)return '';const a=met(x.a),b=met(x.b);if(!b)return a?chip('novo','c-info'):'';const v=(a-b)/Math.abs(b)*100;return `<span class="${v>=0?'ok':'bad'}">${v>=0?'▲':'▼'} ${P(Math.abs(v))}</span>`};
  const ufs=[...new Set(allLojas().map(o=>(o.l.uf||'').toUpperCase()).filter(Boolean))].sort();
  return `<div class="head"><div><h1>Ranking de vendas</h1><p>${pr.l} · ${F.tab==='loja'?'por loja':'por gestor'} · ${metL}</p></div></div>
  <div class="card"><div class="row" style="align-items:flex-end">
   <div class="seg">${[['gestor','Por gestor'],['loja','Por loja']].map(([k,l])=>`<button class="${F.tab===k?'on':''}" data-act="rk" data-k="tab" data-v="${k}">${l}</button>`).join('')}</div>
   <div class="seg">${[['mes','Mês atual'],['mesant','Mês anterior'],['90','90 dias'],['ano','Ano'],['tudo','Tudo']].map(([k,l])=>`<button class="${F.per===k?'on':''}" data-act="rk" data-k="per" data-v="${k}">${l}</button>`).join('')}</div></div>
   <div class="fg" style="margin-top:12px">${fld('rk_met','Ordenar por',0,{sel:[['receita','Receita'],['pecas','Peças'],['margem','Margem de contribuição'],['sellout','Sell-out (PDV)']].map(([k,l])=>opt(k,l,F.met)).join('')})}${fld('rk_uf','UF',0,{sel:opt('','Todas',F.uf)+ufs.map(u=>opt(u,u,F.uf)).join('')})}${fld('rk_canal','Canal',0,{sel:opt('','Todos',F.canal)+Object.entries(CANAIS).map(([k,v])=>opt(k,v,F.canal)).join('')})}</div></div>
  <div class="kpis">${kpi(F.tab==='loja'?'Lojas que compraram':'Gestores que compraram',`${ativos.length}<span class="mut" style="font-size:16px"> / ${linhas.length}</span>`,linhas.length?P(ativos.length/linhas.length*100)+' de positivação':'','hl')}${kpi('Total — '+metL.toLowerCase(),F.met==='receita'||F.met==='margem'?RK(tot):N(tot))}${kpi('Top 10 concentram',P(tot?sum(ativos.slice(0,10),x=>met(x.a))/tot*100:0),'do total do período')}</div>
  <div class="card"><div class="tw"><table><thead><tr><th class="n">#</th><th>${F.tab==='loja'?'Loja':'Gestor'}</th><th>UF</th>${F.tab==='gestor'?'<th class="n">Lojas</th>':''}<th class="n">Pedidos</th><th class="n">Peças</th><th class="n">Receita</th><th class="n">MC</th><th class="n">Ticket médio</th>${F.met==='sellout'?'<th class="n">Sell-out</th>':''}<th style="min-width:120px">${metL}</th><th class="n">${pr.pIni?'vs. anterior':''}</th></tr></thead><tbody>

  </tbody></table></div></div>
  ${sem.length?`<div class="card"><h2>${F.tab==='loja'?'Lojas':'Gestores'} sem venda no período <span class="sm mut">${sem.length}</span></h2><p class="note" style="margin-top:-6px">Oportunidade: ${F.tab==='loja'?'lojas cadastradas que não compraram':'gestores cujas lojas não compraram'} em ${pr.l.toLowerCase()}.</p>
